<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — Admin Tools V3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--ink:#3e2919;--muted:#8d7862;--gold:#c98616;--cream:#fbf5e9;--paper:#fffdf8;--line:#dfcfb3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}header{padding:12px 24px;border-bottom:1px solid var(--line);background:#fffaf1}h1,h2{font-family:Georgia,serif;margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 5px 20px #5c3b1710}.sub{color:var(--muted);margin:6px 0 18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--gold);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}input{width:min(440px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fffaf1;color:var(--ink);font-size:16px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.filter{border:1px solid var(--line);background:#fffaf1;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:12px}.filter.active{background:var(--gold);color:#fff;border-color:var(--gold)}.meta{color:var(--muted);font-size:13px;margin-left:auto}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{background:#fff4dc;font-weight:700;white-space:nowrap}td:nth-child(1){width:45px;text-align:center}td:nth-child(2){min-width:180px;font-weight:700}td:nth-child(3){min-width:260px;white-space:pre-wrap}td:nth-child(4){min-width:130px}td:nth-child(5){min-width:130px;white-space:nowrap}td:nth-child(6){min-width:210px;overflow-wrap:anywhere}.notice{padding:12px 14px;border-radius:12px;background:#fff3c9;margin-top:14px}.error{background:#ffe5e5;color:#9b2525}@media(max-width:700px){header{padding:10px 14px}.wrap{padding:12px 10px}.card{padding:16px;border-radius:18px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1;width:100%}.toolbar .btn{width:100%}.meta{margin-left:0;grid-column:1/-1}.filters{gap:5px}.filter{padding:7px 9px}th,td{font-size:12px;padding:8px}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1>COEP ENTC 1983 — Admin Tools</h1><div class="sub" style="margin-bottom:0">V3 export / print test — independent of the main V3 page.</div></div></header>
<main class="wrap"><section class="card"><h2>Class List</h2><div class="sub">The export and print actions use the current filter and search results.</div><div class="toolbar"><input id="q" placeholder="Name, phone, email..." oninput="renderTable()"><button class="btn" onclick="exportExcel()">Export Excel</button><button class="btn secondary" onclick="printList()">Print</button><span id="meta" class="meta"></span></div><div class="filters"><button class="filter active" data-filter="all" onclick="setFilter('all')">All</button><button class="filter" data-filter="complete" onclick="setFilter('complete')">✓ Done</button><button class="filter" data-filter="pending" onclick="setFilter('pending')">○ Not Done</button><button class="filter" data-filter="admins" onclick="setFilter('admins')">Admin</button></div><div id="status"></div><div class="table-wrap"><table><thead><tr><th>S.N.</th><th>Name</th><th>Address</th><th>Town / City</th><th>Phone No.</th><th>Email</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const sb=supabase.createClient('https://tizxolwmqrwvdheeqxrv.supabase.co','sb_publishable_lYUj7I1I7Rij5o0ptqPWrA_Qs37Aqta');
let members=[],roles={},filter='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const phone=s=>{const raw=String(s??'').trim();if(!raw)return '';const d=raw.replace(/\D/g,'');if(d.length===10)return '+91 '+d;if(d.length===11&&d.startsWith('0'))return '+91 '+d.slice(1);if(d.length===12&&d.startsWith('91'))return '+91 '+d.slice(2);return raw};
function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));renderTable()}
function currentRows(){const q=($('q').value||'').toLowerCase();let r=members.filter(m=>[m.full_name,m.preferred_name,m.mobile,m.whatsapp_phone,m.email,m.current_city,m.current_state,m.current_country,m.detailed_address].some(v=>String(v||'').toLowerCase().includes(q)));if(filter==='complete')r=r.filter(m=>m.profile_completed);if(filter==='pending')r=r.filter(m=>!m.profile_completed);if(filter==='admins')r=r.filter(m=>roles[m.id]==='admin');return r}
function renderTable(){const r=currentRows();$('meta').textContent=r.length+' record'+(r.length===1?'':'s');$('rows').innerHTML=r.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(m.full_name||m.preferred_name||'')+'</td><td>'+esc(m.detailed_address||'')+'</td><td>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(', '))+'</td><td>'+esc(phone(m.mobile||m.whatsapp_phone))+'</td><td>'+esc(m.email||'')+'</td></tr>').join('')||'<tr><td colspan="6">No classmates found.</td></tr>'}
function filterLabel(){return {all:'All',complete:'Done',pending:'Not_Done',admins:'Admin'}[filter]||'All'}
function filename(ext){const d=new Date().toISOString().slice(0,10);return 'COEP_ENTC_1983_'+filterLabel()+'_'+d+ext}
async function exportExcel(){const r=currentRows();if(!r.length)return alert('There are no records in the current filter/search result.');const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Class List');ws.mergeCells('A1:F1');ws.getCell('A1').value='COEP ENTC 1983 — Class Reunion';ws.getCell('A1').font={name:'Georgia',size:16,bold:true};ws.getCell('A2').value=filterLabel()+' · '+new Date().toLocaleDateString();ws.mergeCells('B2:F2');ws.getRow(3).values=['S.N.','Name','Address','Town / City','Phone No.','Email'];ws.getRow(3).font={bold:true};ws.columns=[{width:8},{width:28},{width:42},{width:24},{width:20},{width:34}];r.forEach((m,i)=>ws.addRow([i+1,m.full_name||m.preferred_name||'',m.detailed_address||'', [m.current_city,m.current_state,m.current_country].filter(Boolean).join(', '),phone(m.mobile||m.whatsapp_phone),m.email||'']));ws.eachRow((row,n)=>{if(n>=3)row.eachCell(c=>{c.alignment={vertical:'top',wrapText:true};c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}})});ws.freezeRows(3);ws.autoFilter={from:'A3',to:'F'+(r.length+3)};const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename('.xlsx');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printList(){const r=currentRows();if(!r.length)return alert('There are no records in the current filter/search result.');const rows=r.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(m.full_name||m.preferred_name||'')+'</td><td>'+esc(m.detailed_address||'')+'</td><td>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(', '))+'</td><td>'+esc(phone(m.mobile||m.whatsapp_phone))+'</td><td>'+esc(m.email||'')+'</td></tr>').join('');const w=window.open('','_blank');if(!w)return alert('Please allow pop-ups for printing.');w.document.write('<!doctype html><html><head><title>COEP ENTC 1983 — Class Reunion</title><style>@page{size:landscape;margin:12mm}body{font-family:Arial,sans-serif;color:#3e2919}h1{font:700 22px Georgia,serif;margin:0 0 4px}p{font-size:12px;color:#777;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top}th{background:#eee}td:nth-child(1){width:35px;text-align:center}td:nth-child(2){width:18%}td:nth-child(3){width:30%}td:nth-child(4){width:16%}td:nth-child(5){width:14%}td:nth-child(6){width:22%}.toolbar{margin-bottom:14px}@media print{.toolbar{display:none}}</style></head><body><div class="toolbar"><button onclick="window.print()">Print</button><button onclick="window.close()">Exit</button></div><h1>COEP ENTC 1983 — Class Reunion</h1><p>'+esc(filterLabel())+' · '+esc(new Date().toLocaleDateString())+'</p><table><thead><tr><th>S.N.</th><th>Name</th><th>Address</th><th>Town / City</th><th>Phone No.</th><th>Email</th></tr></thead><tbody>'+rows+'</tbody></table><script>window.onload=function(){window.focus();window.print()}<\/script></body></html>');w.document.close()}
async function start(){try{const s=await sb.auth.getSession();if(!s.data.session){$('status').innerHTML='<div class="notice error">Please sign in to the V3 site first, then open this Admin Tools page.</div>';return}const me=s.data.session.user;const mine=await sb.from('reunion_members').select('id,full_name').eq('auth_user_id',me.id).maybeSingle();if(!mine.data){$('status').innerHTML='<div class="notice error">Your signed-in account is not linked to a class record.</div>';return}const role=await sb.from('reunion_roles').select('role').eq('member_id',mine.data.id).maybeSingle();if(role.data?.role!=='admin'){$('status').innerHTML='<div class="notice error">Admin access is required.</div>';return}const r=await sb.from('reunion_members').select('id,full_name,preferred_name,detailed_address,current_city,current_state,current_country,mobile,whatsapp_phone,email,profile_completed').order('full_name');if(r.error)throw r.error;members=r.data||[];const rr=await sb.from('reunion_roles').select('member_id,role');(rr.data||[]).forEach(x=>roles[x.member_id]=x.role);renderTable()}catch(e){$('status').innerHTML='<div class="notice error">'+esc(e.message||String(e))+'</div>'}}
start();
</script>
</body></html>

async function render(){if(!user){nav();$("app").innerHTML='<section class="card"><h2>Welcome</h2><p class="stat">Enter the email address registered for your class record and we’ll send you a one-time sign-in link.</p><label>Email address</label><input id="email" type="email" placeholder="you@example.com"><div class="actions"><button class="btn" onclick="sendLink()">Send sign-in link</button></div><div id="msg"></div><p class="small">On your first visit, you’ll be asked to match yourself to the class list.</p></section>';return}if(!member)await load();nav();if(!member){$("app").innerHTML='<section class="card"><h2>Find your class record</h2><p class="stat">Your sign-in is recognised, but your class record has not yet been linked. Please contact the reunion administrator.</p><div class="actions"><button class="btn secondary" onclick="logout()">Sign out</button></div><div id="msg"></div></section>';return}const p=await prog();if(location.hash==="#directory")return directory(p);if(location.hash==="#profile")return profile(p);if(location.hash==="#photos")return photosPage();if(location.hash==="#updates")return updatesPage();if(location.hash==="#admin"&&window.isAdmin)return adminPage();return homePage(p)}

async function directory(p){$("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-end"><div><h2>Classmates</h2><div class="stat"><b>'+p.completed_members+' of '+p.total_members+'</b> have completed their forms</div></div><button class="btn" onclick="go(\'profile\')">My Profile</button></div><div class="notice">Click any classmate to view their full profile. All information is optional and is visible to all logged-in classmates.</div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><label>Search classmates</label><input id="q" placeholder="Name, city, profession, company..." oninput="filter()"><div id="list"></div><p class="small">All profile information is optional. Any information a classmate has entered, including detailed home address, is visible to logged-in classmates.</p></section>';const r=await sb.from("reunion_directory").select("*").order("full_name");if(r.error)return $("list").innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';members=r.data||[];photoUrls={};await Promise.all(members.map(async m=>{if(!m.photo_path)return;const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);if(u.data?.signedUrl)photoUrls[m.id]=u.data.signedUrl}));filter()}

ss="detail-grid">'+more+'</div></div><div class="actions"><button class="btn secondary" onclick="closeClassmate()">Close</button></div></section></div>')}

async function deleteUpdate(id){

async function createMember(){
  const full=$("full_name")?.value.trim(), mobile=indianPhone($("mobile")?.value), whatsapp=indianPhone($("whatsapp_phone")?.value), email=$("email")?.value.trim().toLowerCase();

  const patch={full_name:full,preferred_name:$("preferred_name")?.value||null,mobile:mobile||whatsapp,whatsapp_phone:whatsapp||mobile,email:email,class_batch:"COEP ENTC 1983",current_city:$("current_city")?.value||null,current_state:$("current_state")?.value||null,current_country:$("current_country")?.value||null,profession:$("profession")?.value||null,company:$("company")?.value||null,date_of_birth:$("date_of_birth")?.value||null,spouse_name:$("spouse_name")?.value||null,linkedin_url:$("linkedin_url")?.value||null,food_preference:$("food_preference")?.value||null,drink_preference:$("drink_preference")?.value||null,hobbies:$("hobbies")?.value||null,about:$("about")?.value||null,detailed_address:$("detailed_address")?.value||null};

const status=role==="admin"?"admin":(complete?"complete":"pending");
const statusText=role==="admin"?"Admin":(complete?"Profile complete":"Profile not completed");
return '<div class="admin-row"><div class="admin-row-main" onclick="adminEdit('+m.id+')">'+avatar(m)+'<div style="min-width:0"><h3>'+esc(m.preferred_name||m.full_name)+'</h3><div class="admin-status '+status+'"><span class="admin-status-dot"></span>'+statusText+'</div><p>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(", ")||"Location not entered")+'</p><p>'+esc([m.profession,m.company].filter(Boolean).join(" · ")||"No profession/company entered")+'</p></div></div><div class="admin-row-actions"><button class="btn secondary" onclick="adminEdit('+m.id+',event)">Edit</button><button class="btn secondary" onclick="setAdmin('+m.id+',event)">'+(role==="admin"?"Remove Admin":"Make Admin")+'</button><button class="btn danger" onclick="deleteMember('+m.id+',event)">Delete</button></div></div>';
}
function setAdminFilter(filter){
window.adminFilter=filter;
["filterAll","filterComplete","filterPending","filterAdmins"].forEach(id=>$(id)?.classList.remove("active"));
const map={all:"filterAll",complete:"filterComplete",pending:"filterPending",admins:"filterAdmins"};
$(map[filter])?.classList.add("active");
filterAdmin();
}
function filterAdmin(){
const q=($("adminQ")?.value||"").toLowerCase();
let rows=(window.adminMembers||[]).filter(m=>[m.full_name,m.preferred_name,m.mobile,m.whatsapp_phone,m.email,m.current_city,m.current_state,m.current_country,m.profession,m.company].some(v=>String(v||"").toLowerCase().includes(q)));
const f=window.adminFilter||"all";
if(f==="complete")rows=rows.filter(m=>m.profile_completed);
if(f==="pending")rows=rows.filter(m=>!m.profile_completed);
if(f==="admins")rows=rows.filter(m=>(window.adminRoles||{})[m.id]==="admin");
$("adminList").innerHTML=rows.map(adminRow).join("")||'<p class="stat">No classmates found.</p>';
}
async function setAdmin(id,e){
e?.stopPropagation();
const current=(window.adminRoles||{})[id]==="admin";
if(id===member.id&&current)return alert("You cannot remove your own Admin access.");
const r=await sb.from("reunion_roles").upsert({member_id:id,role:current?"user":"admin"},{onConflict:"member_id"});
if(r.error)return alert(r.error.message);
await adminPage();
}
async function deleteMember(id,e){
e?.stopPropagation();
const m=(window.adminMembers||[]).find(x=>Number(x.id)===Number(id));
if(!m)return;
if(id===member.id)return alert("You cannot delete your own Admin record.");
if(!confirm("Delete "+(m.preferred_name||m.full_name)+" from the class directory? This will permanently remove their class record and any profile information stored with it."))return;
if(m.photo_path){
  const sr=await sb.storage.from("reunion-photos").remove([m.photo_path]);
  if(sr.error)return alert("Could not remove the profile photo: "+sr.error.message);
}
const r=await sb.rpc("reunion_admin_delete_member",{p_member_id:id});
if(r.error)return alert(r.error.message);
await adminPage();
}
async function adminEdit(id,e){
e?.stopPropagation();
const m=(window.adminMembers||[]).find(x=>Number(x.id)===Number(id));
if(!m)return;
editingMember={...m};
editingMember.__originalPhotoPath=m.photo_path||null;
editingMember.__removePhoto=false;
window.adminEditing=true;
location.hash="#profile";
await profile(await prog());
}
function previewPhoto(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith("image/")){input.value="";return msg("Please choose an image file.",true)}if(file.size>5*1024*1024){input.value="";return msg("Photo must be 5 MB or smaller.",true)}const r=new FileReader();r.onload=()=>{const el=$("photoPreview");if(el)el.outerHTML='<img id="photoPreview" class="photo-preview" src="'+esc(r.result)+'" alt="Profile photo preview">'};r.readAsDataURL(file)}
function removePhoto(){const target=window.adminEditing?editingMember:member;if(!target)return;if(!target.__originalPhotoPath)target.__originalPhotoPath=target.photo_path||null;const el=$("photoPreview");if(el)el.outerHTML='<div id="photoPreview" class="photo-preview" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(target.full_name)+'</div>';const i=$("photoInput");if(i)i.value="";target.photo_path=null;target.__removePhoto=true}
async function uploadPhoto(){const target=window.adminEditing?editingMember:member;if(!target)return null;const input=$("photoInput"),file=input?.files?.[0],originalPath=target.__originalPhotoPath||target.photo_path||null;if(target.__removePhoto){if(originalPath)await sb.storage.from("reunion-photos").remove([originalPath]);return null}if(!file)return target.photo_path||null;const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=user.id+"/"+target.id+"-"+Date.now()+"."+ext;const up=await sb.storage.from("reunion-photos").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(up.error)throw up.error;if(originalPath&&originalPath!==path)await sb.storage.from("reunion-photos").remove([originalPath]);return path}
async function save(){const target=window.adminEditing?editingMember:member;if(!target||!target.id)return msg("No classmate is selected for this edit.",true);const targetId=Number(target.id);if(!Number.isFinite(targetId))return msg("Invalid classmate record.",true);const keys=["full_name","preferred_name","mobile","whatsapp_phone","email","current_city","current_state","current_country","profession","company","date_of_birth","spouse_name","linkedin_url","food_preference","drink_preference","hobbies","about","detailed_address"],patch={};keys.forEach(k=>patch[k]=$(k)?.value||null);patch.mobile=indianPhone(patch.mobile)||null;patch.whatsapp_phone=indianPhone(patch.whatsapp_phone)||patch.mobile;let photoPath;try{photoPath=await uploadPhoto()}catch(e){return msg("Photo upload failed: "+e.message,true)}patch.photo_path=photoPath;patch.detailed_address=$("detailed_address")?.value||null;const r=await sb.from("reunion_members").update(patch).eq("id",targetId).select().single();if(r.error)return msg(r.error.message,true);if(window.adminEditing){editingMember=r.data;if(member&&Number(member.id)===targetId)member=r.data;}else member=r.data;target.__removePhoto=false;target.__originalPhotoPath=null;if(photoPath){const u=await sb.storage.from("reunion-photos").createSignedUrl(photoPath,3600);if(u.data?.signedUrl)photoUrls[target.id]=u.data.signedUrl}else delete photoUrls[target.id];if(window.adminEditing){window.adminEditing=false;editingMember=null;location.hash="#admin";await adminPage();nav();window.scrollTo(0,0);return}location.hash="#directory";await render();window.scrollTo(0,0);}

async function start(){
  // Initialize the current session first. Do not run database work from inside
  // the initial auth-state callback, which can race with getSession() and leave
  // the page stuck on a blank shell after a magic-link redirect.
  try{
    const s=await sb.auth.getSession();
    if(s.error)throw s.error;
    user=s.data.session?.user||null;
    member=null;
    editingMember=null;
    window.adminEditing=false;
    window.isAdmin=false;
    if(user)await load();
    await render();
  }catch(e){
    console.error("Reunion app startup error:",e);
    $("app").innerHTML='<section class="card"><h2>We could not open the reunion site</h2><div class="notice error">'+esc(e?.message||String(e))+'</div><div class="actions"><button class="btn" onclick="location.reload()">Try again</button><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';
  }

  // Handle later sign-in / sign-out changes after the initial render.
  sb.auth.onAuthStateChange((event,sess)=>{
    user=sess?.user||null;
    member=null;
    editingMember=null;
    window.adminEditing=false;
    window.isAdmin=false;
    setTimeout(async()=>{
      try{
        if(user)await load();
        await render();
      }catch(e){
        console.error("Reunion auth-state error:",e);
        $("app").innerHTML='<section class="card"><h2>We could not open your reunion profile</h2><div class="notice error">'+esc(e?.message||String(e))+'</div><div class="actions"><button class="btn" onclick="location.reload()">Try again</button><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';
      }
    },0);
  });

  // Clean the one-time magic-link tokens from the address bar after the
  // session has been established.
  if(window.location.hash.includes("access_token=")||window.location.hash.includes("refresh_token=")){
    history.replaceState(null,"",window.location.pathname+window.location.search);
  }
}
start();

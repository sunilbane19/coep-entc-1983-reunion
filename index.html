async function render(){if(!user){nav();$("app").innerHTML='<section class="card"><h2>Welcome</h2><p class="stat">Enter the email address registered for your class record and we’ll send you a one-time sign-in link.</p><label>Email address</label><input id="email" type="email" placeholder="you@example.com"><div class="actions"><button class="btn" onclick="sendLink()">Send sign-in link</button></div><div id="msg"></div><p class="small">On your first visit, you’ll be asked to match yourself to the class list.</p></section>';return}if(!member)await load();nav();if(!member){$("app").innerHTML='<section class="card"><h2>Find your class record</h2><p class="stat">Your sign-in is recognised, but your class record has not yet been linked. Please contact the reunion administrator.</p><div class="actions"><button class="btn secondary" onclick="logout()">Sign out</button></div><div id="msg"></div></section>';return}const p=await prog();if(location.hash==="#directory")return directory(p);if(location.hash==="#profile")return profile(p);if(location.hash==="#photos")return photosPage();if(location.hash==="#updates")return updatesPage();if(location.hash==="#admin"&&window.isAdmin)return adminPage();return homePage(p)}
async function sendLink(){const e=$("email").value.trim().toLowerCase();if(!e)return msg("Please enter your email.",true);const check=await sb.rpc("reunion_email_is_registered",{p_email:e});if(check.error)return msg("We couldn't verify that email right now. Please try again.",true);if(!check.data)return msg("That email address is not in our class records. Please check it or contact the reunion administrator.",true);const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:LIVE_URL,shouldCreateUser:false}});msg(error?error.message:"Check your email for the sign-in link.")}
async function claim(){const ph=indianPhone($("claimphone").value);if(!ph)return msg("Please enter your mobile / WhatsApp number.",true);const {data,error}=await sb.rpc("reunion_claim_by_phone",{p_phone:ph});if(error)return msg(error.message,true);await load();render()}
async function logout(){await sb.auth.signOut();user=null;member=null;render()}
async function directory(p){$("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-end"><div><h2>Classmates</h2><div class="stat"><b>'+p.completed_members+' of '+p.total_members+'</b> have completed their forms</div></div><button class="btn" onclick="go(\'profile\')">My Profile</button></div><div class="notice">Click any classmate to view their full profile. All information is optional and is visible to all logged-in classmates.</div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><label>Search classmates</label><input id="q" placeholder="Name, city, profession, company..." oninput="filter()"><div id="list"></div><p class="small">All profile information is optional. Any information a classmate has entered, including detailed home address, is visible to logged-in classmates.</p><div class="actions"><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';const r=await sb.from("reunion_directory").select("*").order("full_name");if(r.error)return $("list").innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';members=r.data||[];photoUrls={};await Promise.all(members.map(async m=>{if(!m.photo_path)return;const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);if(u.data?.signedUrl)photoUrls[m.id]=u.data.signedUrl}));filter()}
function avatar(m){return photoUrls[m.id]?'<div class="avatar photo"><img src="'+esc(photoUrls[m.id])+'" alt="'+esc(m.full_name)+'"></div>':'<div class="avatar">'+init(m.full_name)+'</div>'}
function filter(){const q=($("q")?.value||"").toLowerCase();const rows=members.filter(m=>[m.full_name,m.preferred_name,m.current_city,m.current_state,m.current_country,m.profession,m.company,m.hobbies,m.about,m.spouse_name].some(v=>String(v||"").toLowerCase().includes(q)));$("list").innerHTML=rows.length?'<div class="classmate-grid">'+rows.map(m=>'<article class="classmate-card" onclick="showClassmate('+m.id+')">'+avatar(m)+'<div class="classmate-info"><h3>'+esc(m.preferred_name||m.full_name)+'</h3>'+([m.current_city,m.current_state,m.current_country].filter(Boolean).length?'<p>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(", "))+'</p>':"")+([m.profession,m.company].filter(Boolean).length?'<p class="small">'+esc([m.profession,m.company].filter(Boolean).join(" · "))+'</p>':"")+'</div></article>').join("")+'</div>':'<p class="stat">No classmates found.</p>'}
function detailItem(label,value,full=false){if(!value)return"";if(label==="Mobile"||label==="WhatsApp")value=indianPhone(value);let v=esc(value);if(label==="LinkedIn")v='<a class="link" href="'+esc(value)+'" target="_blank" rel="noopener">Open LinkedIn profile</a>';return '<div class="detail-item '+(full?"full":"")+'"><label>'+label+'</label><div class="detail-value">'+v.replace(/\n/g,"<br>")+'</div></div>'}
async function showClassmate(id){const m=members.find(x=>Number(x.id)===Number(id));if(!m)return;let url=photoUrls[m.id]||"";if(!url&&m.photo_path){const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);url=u.data?.signedUrl||"";photoUrls[m.id]=url}const contact=detailItem("Mobile",m.mobile)+detailItem("WhatsApp",m.whatsapp_phone)+detailItem("Email",m.email)+detailItem("Location",[m.current_city,m.current_state,m.current_country].filter(Boolean).join(", "));const work=detailItem("Profession",m.profession)+detailItem("Company",m.company)+detailItem("LinkedIn",m.linkedin_url);const personal=detailItem("Date of birth",m.date_of_birth)+detailItem("Spouse / partner",m.spouse_name)+detailItem("Food preference",m.food_preference)+detailItem("Drink preference",m.drink_preference);const more=detailItem("Detailed home address",m.detailed_address,true)+detailItem("Hobbies / interests",m.hobbies,true)+detailItem("About",m.about,true)+detailItem("Class / Batch",m.class_batch);$("app").insertAdjacentHTML("beforeend",'<div class="detail-overlay" id="detailOverlay" onclick="if(event.target.id===\'detailOverlay\')closeClassmate()"><section class="detail-card"><div class="detail-top"><div class="detail-head">'+(url?'<img class="detail-photo" src="'+esc(url)+'" alt="'+esc(m.full_name)+'">':'<div class="detail-photo" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(m.full_name)+'</div>')+'<div class="detail-title"><h2>'+esc(m.preferred_name||m.full_name)+'</h2><p class="stat">'+esc(m.full_name)+'</p></div></div><button class="detail-close" aria-label="Close" onclick="closeClassmate()">×</button></div><div class="detail-section"><h3>Contact</h3><div class="detail-grid">'+contact+'</div></div><div class="detail-section"><h3>Where & work</h3><div class="detail-grid">'+work+'</div></div><div class="detail-section"><h3>Personal</h3><div class="detail-grid">'+personal+'</div></div><div class="detail-section"><h3>More</h3><div class="detail-grid">'+more+'</div></div><div class="actions"><button class="btn secondary" onclick="closeClassmate()">Close</button></div></section></div>')}
function closeClassmate(){$("detailOverlay")?.remove()}
function f(l,k,v,disabled=false){const wrap='<div class="'+(k==="about"?"full":"")+'"><label>'+l+'</label>';if(k==="about")return wrap+'<textarea id="about">'+esc(v)+'</textarea></div>';if(k==="food_preference")return wrap+'<select id="food_preference"><option value="">Select</option><option value="Vegetarian" '+(v==="Vegetarian"?"selected":"")+'>Vegetarian</option><option value="Non-vegetarian" '+(v==="Non-vegetarian"?"selected":"")+'>Non-vegetarian</option><option value="Vegan" '+(v==="Vegan"?"selected":"")+'>Vegan</option><option value="Jain" '+(v==="Jain"?"selected":"")+'>Jain</option><option value="No preference" '+(v==="No preference"?"selected":"")+'>No preference</option><option value="Other" '+(v==="Other"?"selected":"")+'>Other</option></select></div>';if(k==="drink_preference")return wrap+'<select id="drink_preference"><option value="">Select</option><option value="Non-drinker" '+(v==="Non-drinker"?"selected":"")+'>Non-drinker</option><option value="Alcoholic" '+(v==="Alcoholic"?"selected":"")+'>Alcoholic</option><option value="Both / no preference" '+(v==="Both / no preference"?"selected":"")+'>Both / no preference</option><option value="Other" '+(v==="Other"?"selected":"")+'>Other</option></select></div>';return wrap+'<input id="'+k+'" value="'+esc(v)+'" '+(disabled?"disabled":"")+'></div>'}
async function profile(p){const m=window.adminEditing?editingMember:member;if(!m)return;const a=m.detailed_address||"";let url=photoUrls[m.id]||"";if(!url&&m.photo_path){const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);url=u.data?.signedUrl||"";photoUrls[m.id]=url}const photoHtml=url?'<img id="photoPreview" class="photo-preview" src="'+esc(url)+'" alt="Profile photo">':'<div id="photoPreview" class="photo-preview" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(m.full_name)+'</div>';$("app").innerHTML='<section class="card"><h2>'+(window.adminEditing?"Edit Classmate":"My Profile")+'</h2><div class="stat">'+p.completed_members+' of '+p.total_members+' classmates have completed their forms.</div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><div class="full photo-field"><div>'+photoHtml+'</div><div style="flex:1"><label>Photo</label><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewPhoto(this)"><p class="small">Choose a clear head-and-shoulders photo. JPG, PNG or WebP, up to 5 MB.</p><button class="btn secondary" type="button" onclick="removePhoto()">Remove photo</button></div></div><div class="grid">'+f("Full name","full_name",m.full_name)+f("Preferred name","preferred_name",m.preferred_name)+f("Mobile","mobile",indianPhone(m.mobile))+whatsappMarkup(m.whatsapp_phone)+f("Email","email",m.email)+f("Class / Batch","class_batch",m.class_batch,true)+f("Current city","current_city",m.current_city)+'<div id="current_state_wrap">'+stateMarkup(m.current_state,m.current_country)+'</div>'+countryMarkup(m.current_country)+f("Profession","profession",m.profession)+f("Company","company",m.company)+f("Date of birth","date_of_birth",m.date_of_birth)+f("Spouse / partner","spouse_name",m.spouse_name)+f("LinkedIn","linkedin_url",m.linkedin_url)+f("Food preference","food_preference",m.food_preference)+f("Drink preference","drink_preference",m.drink_preference)+f("Hobbies / interests","hobbies",m.hobbies)+f("About me","about",m.about)+'<div class="full"><label>Detailed home address</label><textarea id="detailed_address" placeholder="Street, city, country">'+esc(a)+'</textarea></div></div><p class="small">All profile information is optional. Information you enter is visible to logged-in classmates.</p><div class="actions"><button class="btn" onclick="save()">Save</button><button class="btn secondary" onclick="go(window.adminEditing?\'admin\':\'directory\')">Cancel</button><button class="btn danger" onclick="logout()">Sign out</button></div><div id="msg"></div></section>'}

function updateCard(u){return '<article class="update-card">'+(u.title?'<h3>'+esc(u.title)+'</h3>':"")+'<p>'+esc(u.body)+'</p><div class="update-date">'+new Date(u.created_at).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})+'</div></article>'}

async function updatesPage(){
  const r=await sb.from("reunion_class_updates").select("id,title,body,created_at").order("created_at",{ascending:false});
  if(r.error)return $("app").innerHTML='<section class="card"><h2>Class Updates</h2><div class="notice error">'+esc(r.error.message)+'</div></section>';
  const rows=r.data||[];
  $("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:15px;flex-wrap:wrap"><div><h2>Class Updates</h2><p class="stat">Announcements and messages for COEP ENTC 1983.</p></div><button class="btn secondary" onclick="go(\'home\')">Back Home</button></div><div class="update-list">'+(rows.map(updateCard).join("")||'<p class="stat">No updates have been posted yet.</p>')+'</div></section>';
}
async function adminUpdates(){
  if(!window.isAdmin)return go("home");
  const r=await sb.from("reunion_class_updates").select("id,title,body,created_at").order("created_at",{ascending:false});
  if(r.error)return $("app").innerHTML='<section class="card"><h2>Class Updates</h2><div class="notice error">'+esc(r.error.message)+'</div></section>';
  const rows=r.data||[];
  $("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Class Updates</h2><p class="stat">Add a message here and it will appear on the members’ Home page.</p></div><button class="btn secondary" onclick="adminPage()">Back to Admin</button></div><div class="grid" style="margin-top:18px"><div><label>Title (optional)</label><input id="updateTitle" placeholder="e.g. Reunion arrangements"></div><div class="full"><label>Message</label><textarea id="updateBody" style="min-height:150px" placeholder="Type the message to show to classmates..."></textarea></div></div><div class="actions"><button class="btn" onclick="createUpdate()">Post Update</button></div><div id="msg"></div><h3 style="margin-top:28px;font-size:20px">Posted updates</h3><div class="update-admin-list">'+(rows.map(u=>'<div class="update-admin-row"><div>'+(u.title?'<h3>'+esc(u.title)+'</h3>':"")+'<p>'+esc(u.body)+'</p><div class="update-date">'+new Date(u.created_at).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})+'</div></div><button class="btn danger" onclick="deleteUpdate('+u.id+')">Delete</button></div>').join("")||'<p class="stat">No updates posted yet.</p>')+'</div></section>';
}
async function createUpdate(){
  const title=$("updateTitle")?.value.trim()||null, body=$("updateBody")?.value.trim();
  if(!body)return msg("Please enter the update message.",true);
  const r=await sb.from("reunion_class_updates").insert({title,body});
  if(r.error)return msg(r.error.message,true);
  await adminUpdates();
}
async function deleteUpdate(id){
  if(!confirm("Delete this class update?"))return;
  const r=await sb.from("reunion_class_updates").delete().eq("id",id);
  if(r.error)return alert(r.error.message);
  await adminUpdates();
}

async function adminPage(){
const r=await sb.from("reunion_members").select("*").order("full_name");
if(r.error)return $("app").innerHTML='<section class="card"><h2>Admin</h2><div class="notice error">'+esc(r.error.message)+'</div></section>';
const rows=r.data||[];
const rr=await sb.from("reunion_roles").select("member_id,role");
window.adminRoles={};(rr.data||[]).forEach(x=>window.adminRoles[x.member_id]=x.role);
const completed=rows.filter(m=>m.profile_completed).length;
const pending=rows.length-completed;
const admins=rows.filter(m=>(window.adminRoles||{})[m.id]==="admin").length;
$("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Admin</h2><p class="stat">Manage classmates and see who has completed their profile.</p></div><div class="actions" style="margin-top:0"><button class="btn secondary" onclick="adminUpdates()">Class Updates</button><button class="btn" onclick="adminAdd()">+ Add New Member</button></div></div><div class="admin-toolbar"><div><label>Search</label><input id="adminQ" placeholder="Name, phone, email..." oninput="filterAdmin()"></div><div class="small" style="padding-bottom:12px">'+rows.length+' class records</div></div><div class="admin-filters"><button id="filterAll" class="admin-filter active" onclick="setAdminFilter(&quot;all&quot;)">All '+rows.length+'</button><button id="filterComplete" class="admin-filter" onclick="setAdminFilter(&quot;complete&quot;)">✓ Complete '+completed+'</button><button id="filterPending" class="admin-filter" onclick="setAdminFilter(&quot;pending&quot;)">○ Not completed '+pending+'</button><button id="filterAdmins" class="admin-filter" onclick="setAdminFilter(&quot;admins&quot;)">Admin '+admins+'</button></div><div id="adminList" class="admin-list"></div></section>';
window.adminMembers=rows;
window.adminFilter="all";
filterAdmin();
}
function adminAdd(){
  $("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Add New Member</h2><p class="stat">Add the member record with information available. Email is mandatory. All other fields are optional.</p></div><button class="btn secondary" onclick="adminPage()">Back to Admin</button></div><div class="grid" style="margin-top:18px"><div><label>Full name</label><input id="full_name"></div><div><label>Preferred name</label><input id="preferred_name"></div><div><label>Mobile</label><input id="mobile" inputmode="tel"></div>'+whatsappMarkup("")+'<div><label>Email <span class="required">*</span></label><input id="email" type="email" required placeholder="member@example.com"></div><div><label>Current city</label><input id="current_city"></div><div id="current_state_wrap">'+stateMarkup("","")+'</div>'+countryMarkup("")+'<div><label>Profession</label><input id="profession"></div><div><label>Company</label><input id="company"></div><div><label>Date of birth</label><input id="date_of_birth" type="date"></div><div><label>Spouse / partner</label><input id="spouse_name"></div><div><label>LinkedIn</label><input id="linkedin_url"></div><div><label>Food preference</label><select id="food_preference"><option value="">Select</option><option>Vegetarian</option><option>Non-vegetarian</option><option>Vegan</option><option>Jain</option><option>No preference</option><option>Other</option></select></div><div><label>Drink preference</label><select id="drink_preference"><option value="">Select</option><option>Non-drinker</option><option>Alcoholic</option><option>Both / no preference</option><option>Other</option></select></div><div><label>Hobbies / interests</label><input id="hobbies"></div><div class="full"><label>About me</label><textarea id="about"></textarea></div><div class="full"><label>Detailed home address</label><textarea id="detailed_address" placeholder="Street, city, country"></textarea></div></div><p class="small">Only email is required. All other information is optional. The email is used for the member’s secure sign-in link. No account is created on this screen.</p><div class="actions"><button class="btn" onclick="createMember()">Add Member</button><button class="btn secondary" onclick="adminPage()">Cancel</button></div><div id="msg"></div></section>';
}
async function createMember(){
  const full=$("full_name")?.value.trim(), mobile=indianPhone($("mobile")?.value), whatsapp=indianPhone($("whatsapp_phone")?.value), email=$("email")?.value.trim().toLowerCase();
  if(!email)return msg("Please enter the member's email address.",true);
  const duplicate=await sb.from("reunion_members").select("id,full_name").ilike("email",email).limit(1);
  if(duplicate.data?.length)return msg("This email address is already assigned to "+(duplicate.data[0].full_name||"another classmate")+". Please use a different email address.",true);
  const patch={full_name:full,preferred_name:$("preferred_name")?.value||null,mobile:mobile||whatsapp,whatsapp_phone:whatsapp||mobile,email:email,class_batch:"COEP ENTC 1983",current_city:$("current_city")?.value||null,current_state:$("current_state")?.value||null,current_country:$("current_country")?.value||null,profession:$("profession")?.value||null,company:$("company")?.value||null,date_of_birth:$("date_of_birth")?.value||null,spouse_name:$("spouse_name")?.value||null,linkedin_url:$("linkedin_url")?.value||null,food_preference:$("food_preference")?.value||null,drink_preference:$("drink_preference")?.value||null,hobbies:$("hobbies")?.value||null,about:$("about")?.value||null,detailed_address:$("detailed_address")?.value||null};
  const r=await sb.from("reunion_members").insert(patch).select().single();
  if(r.error)return msg(r.error.message,true);
  showMemberAdded();
}
function showMemberAdded(){
  const existing=$("successOverlay"); if(existing) existing.remove();
  document.body.insertAdjacentHTML("beforeend",'<div id="successOverlay" class="success-overlay"><div class="success-card" role="dialog" aria-modal="true" aria-labelledby="memberAddedTitle"><div class="success-icon">✓</div><h3 id="memberAddedTitle">Member added successfully</h3><p>The class record is now ready. The member can sign in using the email address entered for this record.</p><button class="btn" onclick="closeMemberAdded()">Back to Admin</button></div></div>');
}
async function closeMemberAdded(){
  const overlay=$("successOverlay"); if(overlay) overlay.remove();
  await adminPage();
  window.scrollTo(0,0);
}
function adminRow(m){
const role=(window.adminRoles||{})[m.id];
const complete=!!m.profile_completed;
const status=role==="admin"?"admin":(complete?"complete":"pending");
const statusText=role==="admin"?"Admin":(complete?"Profile complete":"Profile not completed");
return '<div class="admin-row"><div class="admin-row-main" onclick="adminEdit('+m.id+')">'+avatar(m)+'<div style="min-width:0"><h3>'+esc(m.preferred_name||m.full_name)+'</h3><div class="admin-status '+status+'"><span class="admin-status-dot"></span>'+statusText+'</div><p>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(", ")||"Location not entered")+'</p><p>'+esc([m.profession,m.company].filter(Boolean).join(" · ")||"No profession/company entered")+'</p></div></div><div class="admin-row-actions"><button class="btn secondary" onclick="adminEdit('+m.id+',event)">Edit</button><button class="btn secondary" onclick="setAdmin('+m.id+',event)">'+(role==="admin"?"Remove Admin":"Make Admin")+'</button><button class="btn danger" onclick="deleteMember('+m.id+',event)">Delete</button></div></div>';
}
function setAdminFilter(filter){
window.adminFilter=filter;
["filterAll","filterComplete","filterPending","filterAdmins"].forEach(id=>$(id)?.classList.remove("active"));
const map={all:"filterAll",complete:"filterComplete",pending:"filterPending",admins:"filterAdmins"};
$(map[filter])?.classList.add("active");
filterAdmin();
}
function filterAdmin(){
const q=($("adminQ")?.value||"").toLowerCase();
let rows=(window.adminMembers||[]).filter(m=>[m.full_name,m.preferred_name,m.mobile,m.whatsapp_phone,m.email,m.current_city,m.current_state,m.current_country,m.profession,m.company].some(v=>String(v||"").toLowerCase().includes(q)));
const f=window.adminFilter||"all";
if(f==="complete")rows=rows.filter(m=>m.profile_completed);
if(f==="pending")rows=rows.filter(m=>!m.profile_completed);
if(f==="admins")rows=rows.filter(m=>(window.adminRoles||{})[m.id]==="admin");
$("adminList").innerHTML=rows.map(adminRow).join("")||'<p class="stat">No classmates found.</p>';
}
async function setAdmin(id,e){
e?.stopPropagation();
const current=(window.adminRoles||{})[id]==="admin";
if(id===member.id&&current)return alert("You cannot remove your own Admin access.");
const r=await sb.from("reunion_roles").upsert({member_id:id,role:current?"user":"admin"},{onConflict:"member_id"});
if(r.error)return alert(r.error.message);
await adminPage();
}
async function deleteMember(id,e){
e?.stopPropagation();
const m=(window.adminMembers||[]).find(x=>Number(x.id)===Number(id));
if(!m)return;
if(id===member.id)return alert("You cannot delete your own Admin record.");
if(!confirm("Delete "+(m.preferred_name||m.full_name)+" from the class directory? This will permanently remove their class record and any profile information stored with it."))return;
if(m.photo_path){
  const sr=await sb.storage.from("reunion-photos").remove([m.photo_path]);
  if(sr.error)return alert("Could not remove the profile photo: "+sr.error.message);
}
const r=await sb.rpc("reunion_admin_delete_member",{p_member_id:id});
if(r.error)return alert(r.error.message);
await adminPage();
}
async function adminEdit(id,e){
e?.stopPropagation();
const m=(window.adminMembers||[]).find(x=>Number(x.id)===Number(id));
if(!m)return;
editingMember=m;
window.adminEditing=true;
location.hash="#profile";
await profile(await prog());
}
function previewPhoto(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith("image/")){input.value="";return msg("Please choose an image file.",true)}if(file.size>5*1024*1024){input.value="";return msg("Photo must be 5 MB or smaller.",true)}const r=new FileReader();r.onload=()=>{const el=$("photoPreview");if(el)el.outerHTML='<img id="photoPreview" class="photo-preview" src="'+esc(r.result)+'" alt="Profile photo preview">'};r.readAsDataURL(file)}
function removePhoto(){const target=window.adminEditing?editingMember:member;if(!target)return;const el=$("photoPreview");if(el)el.outerHTML='<div id="photoPreview" class="photo-preview" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(target.full_name)+'</div>';const i=$("photoInput");if(i)i.value="";target.photo_path=null;target.__removePhoto=true}
async function uploadPhoto(){const target=window.adminEditing?editingMember:member;if(!target)return null;const input=$("photoInput"),file=input?.files?.[0];if(target.__removePhoto){if(target.photo_path)await sb.storage.from("reunion-photos").remove([target.photo_path]);return null}if(!file)return target.photo_path||null;const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=user.id+"/"+target.id+"-"+Date.now()+"."+ext;const up=await sb.storage.from("reunion-photos").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(up.error)throw up.error;if(target.photo_path)await sb.storage.from("reunion-photos").remove([target.photo_path]);return path}
async function save(){const target=window.adminEditing?editingMember:member;const keys=["full_name","preferred_name","mobile","whatsapp_phone","email","current_city","current_state","current_country","profession","company","date_of_birth","spouse_name","linkedin_url","food_preference","drink_preference","hobbies","about","detailed_address"],patch={};keys.forEach(k=>patch[k]=$(k)?.value||null);patch.mobile=indianPhone(patch.mobile)||null;patch.whatsapp_phone=indianPhone(patch.whatsapp_phone)||patch.mobile;let photoPath;try{photoPath=await uploadPhoto()}catch(e){return msg("Photo upload failed: "+e.message,true)}patch.photo_path=photoPath;patch.detailed_address=$("detailed_address")?.value||null;const r=await sb.from("reunion_members").update(patch).eq("id",target.id).select().single();if(r.error)return msg(r.error.message,true);if(window.adminEditing)editingMember=r.data;else member=r.data;target.__removePhoto=false;if(photoPath){const u=await sb.storage.from("reunion-photos").createSignedUrl(photoPath,3600);if(u.data?.signedUrl)photoUrls[target.id]=u.data.signedUrl}else delete photoUrls[target.id];if(window.adminEditing){window.adminEditing=false;editingMember=null;location.hash="#admin";await adminPage();nav();window.scrollTo(0,0);return}location.hash="#directory";await render();window.scrollTo(0,0);}

const GOOGLE_PHOTOS_URL="https://drive.google.com/drive/folders/1klalf7uPTBlRuANP6L_lOE4uUemLReEa?usp=drive_link";

async function start(){
  // Initialize the current session first. Do not run database work from inside
  // the initial auth-state callback, which can race with getSession() and leave
  // the page stuck on a blank shell after a magic-link redirect.
  try{
    const s=await sb.auth.getSession();
    if(s.error)throw s.error;
    user=s.data.session?.user||null;
    member=null;
    editingMember=null;
    window.adminEditing=false;
    window.isAdmin=false;
    if(user)await load();
    await render();
  }catch(e){
    console.error("Reunion app startup error:",e);
    $("app").innerHTML='<section class="card"><h2>We could not open the reunion site</h2><div class="notice error">'+esc(e?.message||String(e))+'</div><div class="actions"><button class="btn" onclick="location.reload()">Try again</button><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';
  }

  // Handle later sign-in / sign-out changes after the initial render.
  sb.auth.onAuthStateChange((event,sess)=>{
    if(event==="INITIAL_SESSION")return;
    user=sess?.user||null;
    member=null;
    editingMember=null;
    window.adminEditing=false;
    window.isAdmin=false;
    setTimeout(async()=>{
      try{
        if(user)await load();
        await render();
      }catch(e){
        console.error("Reunion auth-state error:",e);
        $("app").innerHTML='<section class="card"><h2>We could not open your reunion profile</h2><div class="notice error">'+esc(e?.message||String(e))+'</div><div class="actions"><button class="btn" onclick="location.reload()">Try again</button><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';
      }
    },0);
  });

  // Clean the one-time magic-link tokens from the address bar after the
  // session has been established.
  if(window.location.hash.includes("access_token=")||window.location.hash.includes("refresh_token=")){
    history.replaceState(null,"",window.location.pathname+window.location.search);
  }
}
start();

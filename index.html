function dateInputValue(v){const s=String(v??"").trim();if(!s)return"";if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):""}

let sendLinkBusy=false;let sendLinkTimer=null;function resetSendLinkButton(){sendLinkBusy=false;if(sendLinkTimer){clearInterval(sendLinkTimer);sendLinkTimer=null}const b=document.querySelector('button[onclick="sendLink()"]');if(b){b.disabled=false;b.style.opacity="";b.textContent="Send sign-in link"}}function startSendLinkCooldown(){let seconds=60;sendLinkBusy=true;const b=document.querySelector('button[onclick="sendLink()"]');if(!b)return;b.disabled=true;b.style.opacity=".65";b.textContent="Send again in "+seconds+"s";if(sendLinkTimer)clearInterval(sendLinkTimer);sendLinkTimer=setInterval(()=>{seconds--;if(seconds<=0){resetSendLinkButton()}else{const btn=document.querySelector('button[onclick="sendLink()"]');if(btn)btn.textContent="Send again in "+seconds+"s"}},1000)}async function sendLink(){if(sendLinkBusy)return;const e=$("email").value.trim().toLowerCase();if(!e)return msg("Please enter your email.",true);sendLinkBusy=true;const btn=document.querySelector('button[onclick="sendLink()"]');if(btn){btn.disabled=true;btn.style.opacity=".65";btn.textContent="Sending…"}try{const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:LIVE_URL,shouldCreateUser:true}});if(error){const text=String(error.message||"").toLowerCase();const status=Number(error.status||error.code||0);if(status===429||text.includes("rate")||text.includes("too many")||text.includes("after")||text.includes("security purposes")){startSendLinkCooldown();return msg("Please wait about a minute before requesting another sign-in link. If you already requested one, use the most recent email.",true)}resetSendLinkButton();return msg("We could not send the sign-in link right now. Please try again.",true)}msg("Sign-in email sent. Please check your inbox. If this is your first visit, the email may say “Confirm your email address” — that is expected. Use the most recent email and check Spam or Promotions if needed.");startSendLinkCooldown()}catch(err){resetSendLinkButton();msg("We could not send the sign-in link right now. Please try again.",true)}}

async function createUpdate(){

  const r=await sb.from("reunion_class_updates").insert({title,body});
  if(r.error)return msg(r.error.message,true);
  await adminUpdates();

  if(r.error)return alert(r.error.message);
  await adminUpdates();
}

async function start(){
  // Initialize the current session first. Do not run database work from inside
  // the initial auth-state callback, which can race with getSession() and leave
  // the page stuck on a blank shell after a magic-link redirect.
  try{
    const s=await sb.auth.getSession();
    if(s.error)throw s.error;
    user=s.data.session?.user||null;
    member=null;
    editingMember=null;
    window.adminEditing=false;
    window.isAdmin=false;
    if(user)await load();
    await render();
  }catch(e){
    console.error("Reunion app startup error:",e);
    $("app").innerHTML='<section class="card"><h2>We could not open the reunion site</h2><div class="notice error">'+esc(e?.message||String(e))+'</div><div class="actions"><button class="btn" onclick="location.reload()">Try again</button><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';
  }

  // Handle later sign-in / sign-out changes after the initial render.
  sb.auth.onAuthStateChange((event,sess)=>{
    user=sess?.user||null;
    member=null;
    editingMember=null;
    window.adminEditing=false;
    window.isAdmin=false;
    setTimeout(async()=>{
      try{
        if(user)await load();
        await render();
      }catch(e){
        console.error("Reunion auth-state error:",e);
        $("app").innerHTML='<section class="card"><h2>We could not open your reunion profile</h2><div class="notice error">'+esc(e?.message||String(e))+'</div><div class="actions"><button class="btn" onclick="location.reload()">Try again</button><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';
      }
    },0);
  });

  // Clean the one-time magic-link tokens from the address bar after the
  // session has been established.
  if(window.location.hash.includes("access_token=")||window.location.hash.includes("refresh_token=")){
    history.replaceState(null,"",window.location.pathname+window.location.search);
  }
}
start();
</script></body></html>

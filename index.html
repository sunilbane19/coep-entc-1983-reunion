<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c98616"><title>COEP ENTC 1983 — Class Reunion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#3e2919;--muted:#8d7862;--gold:#c98616;--cream:#fbf5e9;--paper:#fffdf8;--line:#dfcfb3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}header{padding:22px 24px;border-bottom:1px solid var(--line);background:#fffaf1;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}h1,h2,h3{font-family:Georgia,serif;margin:0}h1{font-size:34px}.tag{letter-spacing:3px;color:#b77918;font-weight:700;font-size:13px;margin-top:7px}.container{max-width:980px;margin:auto;padding:28px 20px 60px}.hero{padding:18px 4px 16px}.hero h2{font-size:52px}.hero p{font-size:19px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:20px;box-shadow:0 5px 20px #5c3b1710}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;font-weight:700;color:#806d59;font-size:13px;letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}input,textarea,select{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:#fffaf1;color:var(--ink)}textarea{min-height:90px}.full{grid-column:1/-1}.btn{border:0;border-radius:13px;padding:14px 20px;font-weight:700;cursor:pointer;background:var(--gold);color:white}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:white;color:#c55;border:1px solid #efb5b5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.nav{display:flex;gap:8px}.nav button{border:0;background:transparent;color:var(--ink);font-weight:700;padding:10px;cursor:pointer}.nav .active{background:var(--gold);color:white;border-radius:12px}.notice{padding:13px 15px;border-radius:12px;background:#fff3c9;margin-top:14px}.error{background:#ffe5e5;color:#9b2525}.stat,.small{color:var(--muted)}.small{font-size:13px}.progress{height:10px;background:#eadfca;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress i{display:block;height:100%;background:var(--gold)}.person{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.avatar{width:56px;height:56px;border-radius:50%;background:#fff0b0;border:2px solid #f0d86d;display:grid;place-items:center;font:bold 22px Georgia;color:#a84b0a;flex:none}.person h3{font-size:21px;margin-bottom:5px}.person p{margin:2px 0;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h2{font-size:43px}.top{align-items:flex-start}.nav{margin-top:10px}}
</style></head><body><header><div class="top"><div><h1>Class Reunion</h1><div class="tag">COEP ENTC 1983</div></div><div id="nav" class="nav"></div></div></header><main class="container"><section class="hero"><div class="tag">COEP ENTC 1983</div><h2>Class Reunion</h2><p>A private directory for our classmates.</p></section><div id="app"></div></main>
<script>
const sb=supabase.createClient("https://tizxolwmqrwvdheeqxrv.supabase.co","sb_publishable_lYUj7I1I7Rij5o0ptqPWrA_Qs37Aqta");
const LIVE_URL="https://sunilbane19.github.io/coep-entc-1983-reunion/";
let user=null,member=null,members=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));const init=n=>esc((n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase());
function msg(t,e=false){$("msg").innerHTML='<div class="notice '+(e?"error":"")+'">'+esc(t)+'</div>'}
function nav(){if(!user){$("nav").innerHTML="";return}$("nav").innerHTML='<button class="'+(location.hash!=="#profile"?"active":"")+'" onclick="go(\'directory\')">Classmates</button><button class="'+(location.hash==="#profile"?"active":"")+'" onclick="go(\'profile\')">My Profile</button>'}
function go(x){location.hash=x;render()}
async function load(){const {data}=await sb.from("reunion_members").select("*").eq("auth_user_id",user.id).maybeSingle();member=data||null}
async function prog(){const {data}=await sb.from("reunion_progress").select("*").single();return data||{total_members:0,completed_members:0,completion_percent:0}}
async function render(){nav();if(!user){$("app").innerHTML='<section class="card"><h2>Welcome</h2><p class="stat">Enter your email and we’ll send you a one-time sign-in link. No password and no SMS.</p><label>Email address</label><input id="email" type="email" placeholder="you@example.com"><div class="actions"><button class="btn" onclick="sendLink()">Send sign-in link</button></div><div id="msg"></div><p class="small">On your first visit, you’ll be asked to match yourself to the class list.</p></section>';return}if(!member)await load();if(!member){$("app").innerHTML='<section class="card"><h2>Find your class record</h2><p class="stat">Enter your name and mobile number exactly enough for us to match the imported class list.</p><div class="grid"><div><label>Name</label><input id="claimname"></div><div><label>Mobile</label><input id="claimphone" placeholder="+91 ..."></div></div><div class="actions"><button class="btn" onclick="claim()">Match me to class list</button><button class="btn secondary" onclick="logout()">Sign out</button></div><div id="msg"></div></section>';return}const p=await prog();location.hash==="#profile"?profile(p):directory(p)}
async function sendLink(){const e=$("email").value.trim();if(!e)return msg("Please enter your email.",true);const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:LIVE_URL}});msg(error?error.message:"Check your email for the sign-in link.")}
async function claim(){const n=$("claimname").value.trim(),ph=$("claimphone").value.trim();if(!n||!ph)return msg("Please enter both name and mobile.",true);const {error}=await sb.rpc("reunion_claim_by_name_phone",{p_name:n,p_phone:ph});if(error)return msg(error.message,true);await load();render()}
async function logout(){await sb.auth.signOut();user=null;member=null;render()}
async function directory(p){$("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-end"><div><h2>Classmates</h2><div class="stat"><b>'+p.completed_members+' of '+p.total_members+'</b> have completed their forms</div></div><button class="btn" onclick="go(\'profile\')">My Profile</button></div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><label>Search classmates</label><input id="q" placeholder="Name, city, profession, company..." oninput="filter()"><div id="list"></div><p class="small">Detailed home addresses are private and are not shown here.</p><div class="actions"><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';const r=await sb.from("reunion_directory").select("*").order("full_name");if(r.error)return $("list").innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';members=r.data||[];filter()}
function filter(){const q=($("q")?.value||"").toLowerCase();$("list").innerHTML=members.filter(m=>[m.full_name,m.preferred_name,m.current_city,m.current_state,m.current_country,m.profession,m.company,m.hobbies].some(v=>String(v||"").toLowerCase().includes(q))).map(m=>'<div class="person"><div class="avatar">'+init(m.full_name)+'</div><div><h3>'+esc(m.preferred_name||m.full_name)+'</h3><p>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(", "))+'</p><p class="small">'+esc([m.profession,m.company].filter(Boolean).join(" · "))+'</p></div></div>').join("")||'<p class="stat">No classmates found.</p>'}
function f(l,k,v,disabled=false){return '<div class="'+(k==="about"?"full":"")+'"><label>'+l+'</label>'+(k==="about"?'<textarea id="about">'+esc(v)+'</textarea>':'<input id="'+k+'" value="'+esc(v)+'" '+(disabled?"disabled":"")+'>')+'</div>'}
async function profile(p){const m=member;let pr=await sb.from("reunion_private_profiles").select("detailed_address").eq("member_id",m.id).maybeSingle();const a=pr.data?.detailed_address||"";$("app").innerHTML='<section class="card"><h2>My Profile</h2><div class="stat">'+p.completed_members+' of '+p.total_members+' classmates have completed their forms.</div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><div class="grid">'+f("Full name","full_name",m.full_name,true)+f("Preferred name","preferred_name",m.preferred_name)+f("Mobile","mobile",m.mobile)+f("WhatsApp","whatsapp_phone",m.whatsapp_phone)+f("Email","email",m.email)+f("Class / Batch","class_batch",m.class_batch,true)+f("Current city","current_city",m.current_city)+f("Current state","current_state",m.current_state)+f("Current country","current_country",m.current_country)+f("Profession","profession",m.profession)+f("Company","company",m.company)+f("Date of birth","date_of_birth",m.date_of_birth)+f("Spouse / partner","spouse_name",m.spouse_name)+f("LinkedIn","linkedin_url",m.linkedin_url)+f("Food preference","food_preference",m.food_preference)+f("Drink preference","drink_preference",m.drink_preference)+f("Hobbies / interests","hobbies",m.hobbies)+f("About me","about",m.about)+'<div class="full"><label>Detailed home address — private</label><textarea id="detailed_address" placeholder="Street, city, country">'+esc(a)+'</textarea></div></div><p class="small">Detailed address is stored separately and is never displayed in the classmate directory.</p><div class="actions"><button class="btn" onclick="save()">Save</button><button class="btn secondary" onclick="go(\'directory\')">Cancel</button><button class="btn danger" onclick="logout()">Sign out</button></div><div id="msg"></div></section>'}
async function save(){const keys=["preferred_name","mobile","whatsapp_phone","email","current_city","current_state","current_country","profession","company","date_of_birth","spouse_name","linkedin_url","food_preference","drink_preference","hobbies","about"],patch={};keys.forEach(k=>patch[k]=$(k)?.value||null);if(!patch.whatsapp_phone)patch.whatsapp_phone=patch.mobile;const r=await sb.from("reunion_members").update(patch).eq("id",member.id).select().single();if(r.error)return msg(r.error.message,true);member=r.data;const p=await sb.from("reunion_private_profiles").upsert({member_id:member.id,detailed_address:$("detailed_address").value,updated_at:new Date().toISOString()},{onConflict:"member_id"});msg(p.error?p.error.message:"Saved successfully.")}
async function start(){const s=await sb.auth.getSession();user=s.data.session?.user||null;sb.auth.onAuthStateChange(async(_,sess)=>{user=sess?.user||null;member=null;await render()});await render()}start();
</script></body></html>

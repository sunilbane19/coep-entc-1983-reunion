<script>
const sb=supabase.createClient("https://tizxolwmqrwvdheeqxrv.supabase.co","sb_publishable_lYUj7I1I7Rij5o0ptqPWrA_Qs37Aqta");
const LIVE_URL="https://sunilbane19.github.io/coep-entc-1983-reunion/";
let user=null,member=null,members=[],photoUrls={};const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));const init=n=>esc((n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase());
function msg(t,e=false){$("msg").innerHTML='<div class="notice '+(e?"error":"")+'">'+esc(t)+'</div>'}

function go(x){location.hash=x;render()}
async function load(){const {data}=await sb.from("reunion_members").select("*").eq("auth_user_id",user.id).maybeSingle();member=data||null;if(member){const r=await sb.from("reunion_roles").select("role").eq("member_id",member.id).maybeSingle();window.isAdmin=r.data?.role==="admin"}}
async function prog(){const {data}=await sb.from("reunion_progress").select("*").single();return data||{total_members:0,completed_members:0,completion_percent:0}}
async function render(){nav();if(!user){$("app").innerHTML='<section class="card"><h2>Welcome</h2><p class="stat">Enter your email and we’ll send you a one-time sign-in link.</p><label>Email address</label><input id="email" type="email" placeholder="you@example.com"><div class="actions"><button class="btn" onclick="sendLink()">Send sign-in link</button></div><div id="msg"></div><p class="small">On your first visit, you’ll be asked to match yourself to the class list.</p></section>';return}if(!member)await load();if(!member){$("app").innerHTML='<section class="card"><h2>Find your class record</h2><p class="stat">Enter the mobile / WhatsApp number from the class list. No need to enter your name.</p><div class="grid"><div class="full"><label>Mobile / WhatsApp number</label><input id="claimphone" inputmode="tel" placeholder="+91 ..."></div></div><div class="actions"><button class="btn" onclick="claim()">Find my record</button><button class="btn secondary" onclick="logout()">Sign out</button></div><div id="msg"></div></section>';return}const p=await prog();if(location.hash==="#profile")return profile(p);if(location.hash==="#admin"&&window.isAdmin)return adminPage();return directory(p)}
async function sendLink(){const e=$("email").value.trim();if(!e)return msg("Please enter your email.",true);const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:LIVE_URL}});msg(error?error.message:"Check your email for the sign-in link.")}
async function claim(){const ph=$("claimphone").value.trim();if(!ph)return msg("Please enter your mobile / WhatsApp number.",true);const {data,error}=await sb.rpc("reunion_claim_by_phone",{p_phone:ph});if(error)return msg(error.message,true);await load();render()}
async function logout(){await sb.auth.signOut();user=null;member=null;render()}
async function directory(p){$("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-end"><div><h2>Classmates</h2><div class="stat"><b>'+p.completed_members+' of '+p.total_members+'</b> have completed their forms</div></div><button class="btn" onclick="go(\'profile\')">My Profile</button></div><div class="notice">Click any classmate to view their full profile. All information is optional, including detailed home address, and is visible to logged-in classmates.</div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><label>Search classmates</label><input id="q" placeholder="Name, city, profession, company..." oninput="filter()"><div id="list"></div><p class="small">All profile information is optional. Any information a classmate has entered, including detailed home address, is visible to logged-in classmates.</p><div class="actions"><button class="btn secondary" onclick="logout()">Sign out</button></div></section>';const r=await sb.from("reunion_directory").select("*").order("full_name");if(r.error)return $("list").innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';members=r.data||[];photoUrls={};await Promise.all(members.map(async m=>{if(!m.photo_path)return;const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);if(u.data?.signedUrl)photoUrls[m.id]=u.data.signedUrl}));filter()}
function avatar(m){return photoUrls[m.id]?'<div class="avatar photo"><img src="'+esc(photoUrls[m.id])+'" alt="'+esc(m.full_name)+'"></div>':'<div class="avatar">'+init(m.full_name)+'</div>'}
function filter(){const q=($("q")?.value||"").toLowerCase();$("list").innerHTML=members.filter(m=>[m.full_name,m.preferred_name,m.current_city,m.current_state,m.current_country,m.profession,m.company,m.hobbies,m.about,m.spouse_name].some(v=>String(v||"").toLowerCase().includes(q))).map(m=>'<div class="person" onclick="showClassmate('+m.id+')">'+avatar(m)+'<div><h3>'+esc(m.preferred_name||m.full_name)+'</h3><p>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(", "))+'</p><p class="small">'+esc([m.profession,m.company].filter(Boolean).join(" · "))+'</p></div></div>').join("")||'<p class="stat">No classmates found.</p>'}
function detailItem(label,value,full=false){if(!value)return"";let v=esc(value);if(label==="LinkedIn")v='<a class="link" href="'+esc(value)+'" target="_blank" rel="noopener">Open LinkedIn profile</a>';return '<div class="detail-item '+(full?"full":"")+'"><label>'+label+'</label><div class="detail-value">'+v.replace(/\n/g,"<br>")+'</div></div>'}
async function showClassmate(id){const m=members.find(x=>Number(x.id)===Number(id));if(!m)return;let url=photoUrls[m.id]||"";if(!url&&m.photo_path){const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);url=u.data?.signedUrl||"";photoUrls[m.id]=url}const contact=detailItem("Mobile",m.mobile)+detailItem("WhatsApp",m.whatsapp_phone)+detailItem("Email",m.email)+detailItem("Location",[m.current_city,m.current_state,m.current_country].filter(Boolean).join(", "));const work=detailItem("Profession",m.profession)+detailItem("Company",m.company)+detailItem("LinkedIn",m.linkedin_url);const personal=detailItem("Date of birth",m.date_of_birth)+detailItem("Spouse / partner",m.spouse_name)+detailItem("Food preference",m.food_preference)+detailItem("Drink preference",m.drink_preference);const more=detailItem("Detailed home address",m.detailed_address,true)+detailItem("Hobbies / interests",m.hobbies,true)+detailItem("About",m.about,true)+detailItem("Class / Batch",m.class_batch);$("app").insertAdjacentHTML("beforeend",'<div class="detail-overlay" id="detailOverlay" onclick="if(event.target.id===\'detailOverlay\')closeClassmate()"><section class="detail-card"><div class="detail-top"><div class="detail-head">'+(url?'<img class="detail-photo" src="'+esc(url)+'" alt="'+esc(m.full_name)+'">':'<div class="detail-photo" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(m.full_name)+'</div>')+'<div class="detail-title"><h2>'+esc(m.preferred_name||m.full_name)+'</h2><p class="stat">'+esc(m.full_name)+'</p></div></div><button class="detail-close" aria-label="Close" onclick="closeClassmate()">×</button></div><div class="detail-section"><h3>Contact</h3><div class="detail-grid">'+contact+'</div></div><div class="detail-section"><h3>Where & work</h3><div class="detail-grid">'+work+'</div></div><div class="detail-section"><h3>Personal</h3><div class="detail-grid">'+personal+'</div></div><div class="detail-section"><h3>More</h3><div class="detail-grid">'+more+'</div></div><div class="actions"><button class="btn secondary" onclick="closeClassmate()">Close</button></div></section></div>')}
function closeClassmate(){$("detailOverlay")?.remove()}
function f(l,k,v,disabled=false){const wrap='<div class="'+(k==="about"?"full":"")+'"><label>'+l+'</label>';if(k==="about")return wrap+'<textarea id="about">'+esc(v)+'</textarea></div>';if(k==="food_preference")return wrap+'<select id="food_preference"><option value="">Select</option><option value="Vegetarian" '+(v==="Vegetarian"?"selected":"")+'>Vegetarian</option><option value="Non-vegetarian" '+(v==="Non-vegetarian"?"selected":"")+'>Non-vegetarian</option><option value="Vegan" '+(v==="Vegan"?"selected":"")+'>Vegan</option><option value="Jain" '+(v==="Jain"?"selected":"")+'>Jain</option><option value="No preference" '+(v==="No preference"?"selected":"")+'>No preference</option><option value="Other" '+(v==="Other"?"selected":"")+'>Other</option></select></div>';if(k==="drink_preference")return wrap+'<select id="drink_preference"><option value="">Select</option><option value="Non-drinker" '+(v==="Non-drinker"?"selected":"")+'>Non-drinker</option><option value="Alcoholic" '+(v==="Alcoholic"?"selected":"")+'>Alcoholic</option><option value="Both / no preference" '+(v==="Both / no preference"?"selected":"")+'>Both / no preference</option><option value="Other" '+(v==="Other"?"selected":"")+'>Other</option></select></div>';return wrap+'<input id="'+k+'" value="'+esc(v)+'" '+(disabled?"disabled":"")+'></div>'}
async function profile(p){const m=member;const a=m.detailed_address||"";let url=photoUrls[m.id]||"";if(!url&&m.photo_path){const u=await sb.storage.from("reunion-photos").createSignedUrl(m.photo_path,3600);url=u.data?.signedUrl||"";photoUrls[m.id]=url}const photoHtml=url?'<img id="photoPreview" class="photo-preview" src="'+esc(url)+'" alt="Profile photo">':'<div id="photoPreview" class="photo-preview" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(m.full_name)+'</div>';$("app").innerHTML='<section class="card"><h2>'+(window.adminEditing?"Edit Classmate":"My Profile")+'</h2><div class="stat">'+p.completed_members+' of '+p.total_members+' classmates have completed their forms.</div><div class="progress"><i style="width:'+p.completion_percent+'%"></i></div><div class="full photo-field"><div>'+photoHtml+'</div><div style="flex:1"><label>Photo</label><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewPhoto(this)"><p class="small">Choose a clear head-and-shoulders photo. JPG, PNG or WebP, up to 5 MB.</p><button class="btn secondary" type="button" onclick="removePhoto()">Remove photo</button></div></div><div class="grid">'+f("Full name","full_name",m.full_name,true)+f("Preferred name","preferred_name",m.preferred_name)+f("Mobile","mobile",m.mobile)+f("WhatsApp","whatsapp_phone",m.whatsapp_phone)+f("Email","email",m.email)+f("Class / Batch","class_batch",m.class_batch,true)+f("Current city","current_city",m.current_city)+f("Current state","current_state",m.current_state)+f("Current country","current_country",m.current_country)+f("Profession","profession",m.profession)+f("Company","company",m.company)+f("Date of birth","date_of_birth",m.date_of_birth)+f("Spouse / partner","spouse_name",m.spouse_name)+f("LinkedIn","linkedin_url",m.linkedin_url)+f("Food preference","food_preference",m.food_preference)+f("Drink preference","drink_preference",m.drink_preference)+f("Hobbies / interests","hobbies",m.hobbies)+f("About me","about",m.about)+'<div class="full"><label>Detailed home address (optional)</label><textarea id="detailed_address" placeholder="Street, city, country">'+esc(a)+'</textarea></div></div><p class="small">All profile information is optional. Information you enter is visible to logged-in classmates.</p><div class="actions"><button class="btn" onclick="save()">Save</button><button class="btn secondary" onclick="go(window.adminEditing?\'admin\':\'directory\')">Cancel</button><button class="btn danger" onclick="logout()">Sign out</button></div><div id="msg"></div></section>'}
async function adminPage(){
const r=await sb.from("reunion_members").select("*").order("full_name");
if(r.error)return $("app").innerHTML='<section class="card"><h2>Admin</h2><div class="notice error">'+esc(r.error.message)+'</div></section>';
const rows=r.data||[];
const rr=await sb.from("reunion_roles").select("member_id,role");
window.adminRoles={};(rr.data||[]).forEach(x=>window.adminRoles[x.member_id]=x.role);
$("app").innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Admin</h2><p class="stat">Manage classmates and administrator access.</p></div><button class="btn secondary" onclick="go(\'directory\')">Classmates</button></div><div class="admin-toolbar"><div><label>Search</label><input id="adminQ" placeholder="Name, phone, email..." oninput="filterAdmin()"></div><div class="small" style="padding-bottom:12px">'+rows.length+' class records</div></div><div id="adminList" class="admin-list"></div></section>';
window.adminMembers=rows;
filterAdmin();
}
function adminRow(m){
const role=(window.adminRoles||{})[m.id];
return '<div class="admin-row"><div class="admin-row-main" onclick="adminEdit('+m.id+')">'+avatar(m)+'<div style="min-width:0"><h3>'+esc(m.preferred_name||m.full_name)+'</h3><p>'+esc([m.current_city,m.current_state,m.current_country].filter(Boolean).join(", ")||"Location not entered")+'</p><p>'+esc([m.profession,m.company].filter(Boolean).join(" · ")||"No profession/company entered")+'</p></div></div><div class="admin-row-actions"><button class="btn secondary" onclick="adminEdit('+m.id+',event)">Edit</button><button class="btn secondary" onclick="setAdmin('+m.id+',event)">'+(role==="admin"?"Remove Admin":"Make Admin")+'</button><button class="btn danger" onclick="deleteMember('+m.id+',event)">Delete</button></div></div>';
}
function filterAdmin(){
const q=($("adminQ")?.value||"").toLowerCase();
const rows=(window.adminMembers||[]).filter(m=>[m.full_name,m.preferred_name,m.mobile,m.whatsapp_phone,m.email,m.current_city,m.current_state,m.current_country,m.profession,m.company].some(v=>String(v||"").toLowerCase().includes(q)));
$("adminList").innerHTML=rows.map(adminRow).join("")||'<p class="stat">No classmates found.</p>';
}
async function setAdmin(id,e){
e?.stopPropagation();
const current=(window.adminRoles||{})[id]==="admin";
if(id===member.id&&current)return alert("You cannot remove your own Admin access.");
const r=await sb.from("reunion_roles").upsert({member_id:id,role:current?"user":"admin"},{onConflict:"member_id"});
if(r.error)return alert(r.error.message);
await adminPage();
}
async function deleteMember(id,e){
e?.stopPropagation();
const m=(window.adminMembers||[]).find(x=>Number(x.id)===Number(id));
if(!m)return;
if(id===member.id)return alert("You cannot delete your own Admin record.");
if(!confirm("Delete "+(m.preferred_name||m.full_name)+" from the class directory? This will permanently remove their class record and any profile information stored with it."))return;
if(m.photo_path){
  const sr=await sb.storage.from("reunion-photos").remove([m.photo_path]);
  if(sr.error)return alert("Could not remove the profile photo: "+sr.error.message);
}
const r=await sb.rpc("reunion_admin_delete_member",{p_member_id:id});
if(r.error)return alert(r.error.message);
await adminPage();
}
async function adminEdit(id,e){
e?.stopPropagation();
const m=(window.adminMembers||[]).find(x=>Number(x.id)===Number(id));
if(!m)return;
member=m;
window.adminEditing=true;
location.hash="#profile";
await profile(await prog());
}
function previewPhoto(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith("image/")){input.value="";return msg("Please choose an image file.",true)}if(file.size>5*1024*1024){input.value="";return msg("Photo must be 5 MB or smaller.",true)}const r=new FileReader();r.onload=()=>{const el=$("photoPreview");if(el)el.outerHTML='<img id="photoPreview" class="photo-preview" src="'+esc(r.result)+'" alt="Profile photo preview">'};r.readAsDataURL(file)}
function removePhoto(){const el=$("photoPreview");if(el)el.outerHTML='<div id="photoPreview" class="photo-preview" style="display:grid;place-items:center;font:bold 30px Georgia;color:#a84b0a">'+init(member.full_name)+'</div>';const i=$("photoInput");if(i)i.value="";member.photo_path=null;member.__removePhoto=true}
async function uploadPhoto(){const input=$("photoInput"),file=input?.files?.[0];if(member.__removePhoto){if(member.photo_path)await sb.storage.from("reunion-photos").remove([member.photo_path]);return null}if(!file)return member.photo_path||null;const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=user.id+"/"+member.id+"-"+Date.now()+"."+ext;const up=await sb.storage.from("reunion-photos").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(up.error)throw up.error;if(member.photo_path)await sb.storage.from("reunion-photos").remove([member.photo_path]);return path}
async function save(){const keys=["preferred_name","mobile","whatsapp_phone","email","current_city","current_state","current_country","profession","company","date_of_birth","spouse_name","linkedin_url","food_preference","drink_preference","hobbies","about"],patch={};keys.forEach(k=>patch[k]=$(k)?.value||null);if(!patch.whatsapp_phone)patch.whatsapp_phone=patch.mobile;let photoPath;try{photoPath=await uploadPhoto()}catch(e){return msg("Photo upload failed: "+e.message,true)}patch.photo_path=photoPath;const r=await sb.from("reunion_members").update(patch).eq("id",member.id).select().single();if(r.error)return msg(r.error.message,true);member=r.data;member.__removePhoto=false;if(photoPath){const u=await sb.storage.from("reunion-photos").createSignedUrl(photoPath,3600);if(u.data?.signedUrl)photoUrls[member.id]=u.data.signedUrl}else delete photoUrls[member.id];member.detailed_address=$("detailed_address").value||null;const p=await sb.from("reunion_members").update({detailed_address:member.detailed_address}).eq("id",member.id);if(p.error)return msg(p.error.message,true);if(window.adminEditing){window.adminEditing=false;location.hash="#admin";await adminPage();nav();return}msg("Saved successfully.")}
async function start(){const s=await sb.auth.getSession();user=s.data.session?.user||null;sb.auth.onAuthStateChange(async(_,sess)=>{user=sess?.user||null;member=null;await render()});await render()}start();
</script></body></html>

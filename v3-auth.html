<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — Signing in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#fbf5e9;color:#3e2919;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{background:#fffdf8;border:1px solid #dfcfb3;border-radius:20px;padding:28px;max-width:520px;margin:20px;text-align:center}h1{font:700 26px Georgia,serif;margin:0 0 10px}.small{color:#8d7862}</style>
</head>
<body>
<section class="card"><h1>Signing you in…</h1><p id="status" class="small">Please wait. You will be returned to the Reunion home page.</p></section>
<script>
(async function(){
  const status=document.getElementById('status');
  const SUPABASE_URL='https://tizxolwmqrwvdheeqxrv.supabase.co';
  const SUPABASE_KEY='sb_publishable_lYUj7I1I7Rij5o0ptqPWrA_Qs37Aqta';
  try{
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
    let completed=false;
    function finish(){
      if(completed)return;completed=true;
      try{localStorage.setItem('v3_auth_complete',String(Date.now()));}catch(e){}
      try{window.opener&&window.opener.postMessage({type:'v3_auth_complete',returnHash:'#home'},location.origin);}catch(e){}
      try{window.close();}catch(e){}
      // If the browser refuses to close this tab, keep a safe fallback so
      // the authentication callback is never left stranded.
      setTimeout(function(){
        try{if(window.closed)return;}catch(e){}
        try{window.focus();}catch(e){}
        location.replace('/v3/#home');
      },1200);
    }
    const p=new URLSearchParams(location.search);
    const code=p.get('code');
    const tokenHash=p.get('token_hash');
    const type=p.get('type');
    if(code){
      status.textContent='Completing secure sign-in…';
      const r=await sb.auth.exchangeCodeForSession(code);
      if(r.error)throw r.error;
      finish();return;
    }
    if(tokenHash&&type){
      status.textContent='Completing secure sign-in…';
      const r=await sb.auth.verifyOtp({token_hash:tokenHash,type:type});
      if(r.error)throw r.error;
      finish();return;
    }
    const {data:{session}}=await sb.auth.getSession();
    if(session){finish();return;}
    sb.auth.onAuthStateChange((event,session)=>{if(session&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))finish();});
    setTimeout(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){finish();return;}status.textContent='The sign-in link could not be completed. Please request a fresh sign-in link.';},6000);
  }catch(e){
    status.textContent='The sign-in link could not be completed. Please request a fresh sign-in link.';
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — Signing in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#fbf5e9;color:#3e2919;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{background:#fffdf8;border:1px solid #dfcfb3;border-radius:20px;padding:28px;max-width:520px;margin:20px;text-align:center}h1{font:700 26px Georgia,serif;margin:0 0 10px}.small{color:#8d7862}</style>
</head>
<body>
<section class="card"><h1>Signing you in…</h1><p id="status" class="small">Please wait. You will be returned to the Reunion home page.</p></section>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    const html=await fetch('/',{cache:'no-store'}).then(r=>r.text());
    const m=html.match(/supabase\.createClient\(["']([^"']+)["'],["']([^"']+)["']/);
    if(!m)throw new Error('Supabase configuration not found');
    const sb=supabase.createClient(m[1],m[2],{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    let completed=false;
    function finish(){
      if(completed)return;completed=true;
      try{localStorage.setItem('v3_auth_complete',String(Date.now()));}catch(e){}
      try{window.opener&&window.opener.postMessage({type:'v3_auth_complete',returnHash:'#home'},location.origin);}catch(e){}
      try{window.close();}catch(e){}
      setTimeout(function(){try{window.focus();}catch(e){}location.replace('/v3.html#home');},700);
    }
    const {data:{session}}=await sb.auth.getSession();
    if(session){finish();return;}
    sb.auth.onAuthStateChange((event,session)=>{if(session&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))finish();});
    setTimeout(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){finish();return;}status.textContent='The sign-in link could not be completed. Please request a fresh sign-in link.';},5000);
  }catch(e){status.textContent='The sign-in link could not be completed. Please request a fresh sign-in link.';}
})();
</script>
</body>
</html>

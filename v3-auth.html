<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — Signing in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#fbf5e9;color:#3e2919;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{background:#fffdf8;border:1px solid #dfcfb3;border-radius:20px;padding:28px;max-width:520px;margin:20px;text-align:center}h1{font:700 26px Georgia,serif;margin:0 0 10px}.small{color:#8d7862}</style>
</head>
<body>
<section class="card">
<h1>Signing you in…</h1>
<p id="status" class="small">Please wait. You will be taken to V3 automatically.</p>
</section>
<script>
(async function(){
  const status=document.getElementById('status');
  const sb=supabase.createClient('https://tizxolwmqrwvdheeqxrv.supabase.co','sb_publishable_lYUj7I1I7Rij5o0ptqPWrAq',{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  let completed=false;
  function finish(){
    if(completed)return;
    completed=true;
    try{localStorage.setItem('v3_auth_complete',String(Date.now()));}catch(e){}
    try{window.opener&&window.opener.postMessage({type:'v3_auth_complete'},location.origin);}catch(e){}
    setTimeout(function(){try{window.close();}catch(e){}},250);
    setTimeout(function(){location.replace('/v3.html#admin');},500);
  }
  const {data:{session}}=await sb.auth.getSession();
  if(session){finish();return;}
  sb.auth.onAuthStateChange((event,session)=>{if(session&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))finish();});
  setTimeout(async()=>{
    const {data:{session}}=await sb.auth.getSession();
    if(session){finish();return;}
    status.textContent='The sign-in link could not be completed. Please request a fresh sign-in link.';
  },5000);
})();
</script>
</body>
</html>

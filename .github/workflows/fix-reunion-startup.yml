name: Fix reunion startup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair startup loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=re.search(r'const sb=window\.supabase\?\.createClient\("https://tizxolwmqrwvdheeqxrv\.supabase\.co","sb_publishable_[^"]+"\);if\(!sb\)\{.*?throw new Error\("Supabase client library failed to load"\);\}',s,re.S)
          if old:
            new='''const $=id=>document.getElementById(id);
          let sb=null;
          const SUPABASE_URL="https://tizxolwmqrwvdheeqxrv.supabase.co";
          const SUPABASE_KEY="sb_publishable_lYUj7I1I7Rij5o0ptqPWrA_Qs37Aqta";
          async function ensureSupabase(){
            if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return sb;}
            const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];
            for(const src of urls){try{await new Promise((resolve,reject)=>{const el=document.createElement("script");el.src=src;el.async=true;el.onload=resolve;el.onerror=reject;document.head.appendChild(el)});if(window.supabase?.createClient)break}catch(_){}}
            if(!window.supabase?.createClient)throw new Error("The secure sign-in service could not be loaded. Please refresh the page.");
            sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return sb;
          }'''
            s=s[:old.start()]+new+s[old.end():]
            s=s.replace('const $=id=>document.getElementById(id);const esc=','const esc=',1)
            s=s.replace('async function start(){\n  try{\n    user=null;','async function start(){\n  try{\n    await ensureSupabase();\n    user=null;',1)
          # This malformed concatenation was causing the browser to stop parsing the whole script.
          s=s.replace('+f("Class / Batch","class_batch",m.class_batch,true)</div><p class', '+f("Class / Batch","class_batch",m.class_batch,true)+"</div><p class', 1)
          p.write_text(s,encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path("/tmp/reunion-inline.js").write_text(scripts[-1],encoding="utf-8")
          PY
          npm install --no-save acorn@8
          node - <<'JS'
          const fs=require('fs'),acorn=require('acorn');
          const s=fs.readFileSync('/tmp/reunion-inline.js','utf8');
          try{acorn.parse(s,{ecmaVersion:'latest',sourceType:'script'});console.log('JavaScript syntax OK');}
          catch(e){
            console.error('SYNTAX:',e.message,'at',e.pos,'line',e.loc?.line,'column',e.loc?.column);
            process.exit(1);
          }
          JS
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix reunion site startup and profile script"
            git push
          fi

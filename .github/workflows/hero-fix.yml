name: Deploy V3 Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fix-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V3 source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('v3/index.html')
          s = p.read_text(encoding='utf-8')

          # The homePage HTML is embedded inside a JavaScript string, so the
          # source attribute contains escaped quotes in the file.
          replacements = [
              ('src=\\"coep-entc-1983-group.avif\\"', 'src=\\"/v3/Gang%20COEP%20Header.jpg?v=20260917e\\"'),
              ('src="coep-entc-1983-group.avif"', 'src="/v3/Gang%20COEP%20Header.jpg?v=20260917e"'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          # IMPORTANT: Photos is rendered by the lexical photosPage() function
          # inside index.html. Replacing window.photosPage from an enhancement
          # script does not change what render() calls. Make the database-backed
          # album renderer the actual page function instead of patching around it.
          photo_renderer = '''async function photosPage(){
  var app=$("app");
  if(!app)return;
  app.innerHTML='<section class="card"><div><h2>Photos</h2><div class="stat">Our reunion photographs are shared in our common Google Photos albums.</div></div><div id="v3PhotoAlbums" class="v3-photo-album-grid"><div class="stat">Loading albums…</div></div></section>';
  var r=await sb.from("reunion_photo_albums").select("id,title,description,url,sort_order,is_active").eq("is_active",true).order("sort_order",{ascending:true}).order("id",{ascending:true});
  if(r.error){return app.innerHTML='<section class="card"><h2>Photos</h2><div class="notice error">'+esc(r.error.message)+'</div></section>';}
  var rows=r.data||[],host=$("v3PhotoAlbums");
  if(!host)return;
  host.innerHTML=rows.length?rows.map(function(a){return '<article class="v3-photo-album-card"><div class="album-order">Album '+esc(a.sort_order)+'</div><h3>'+esc(a.title||"Photo Album")+'</h3><p>'+esc(a.description||"")+'</p><div class="actions"><a class="btn" href="'+esc(a.url||"#")+'" target="_blank" rel="noopener noreferrer">Open Photo Album →</a></div></article>';}).join(""):'<p class="stat">No photo albums have been added yet.</p>';
}
'''

          # Replace the old lexical renderer, not window.photosPage. The old
          # function is followed by the next top-level declaration.
          pattern = r'async function photosPage\(\)\{.*?\n\}\n\n'
          s, n = re.subn(pattern, photo_renderer, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace the original lexical photosPage() function.')

          # Every deployment gets a unique query string for admin-tools.js.
          asset_version = os.environ.get('GITHUB_SHA', 'dev')
          pattern = r'<script src="/v3/v3-admin-tools\.js\?v=[^"]+"></script>'
          replacement = f'<script src="/v3/v3-admin-tools.js?v={asset_version}"></script>'
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not find the V3 admin-tools script tag to cache-bust.')

          css = '''
          .home-hero{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)!important;align-items:stretch!important;gap:18px!important}
          .home-photo{height:auto!important;min-height:0!important;overflow:hidden!important;align-self:stretch!important}
          .home-photo img{width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important;display:block!important}
          @media(max-width:800px){.home-hero{grid-template-columns:1fr!important}.home-photo{order:1!important;height:auto!important}.home-copy{order:2!important}.home-photo img{width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important}}
          '''
          marker = '</style>'
          if '.home-photo img{width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:auto!important' not in s:
              s = s.replace(marker, css + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git rm -f --ignore-unmatch v3/coep-entc-1983-group.avif

      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/index.html
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
          else
            git commit -m 'V3: make Photos renderer part of page lifecycle'
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

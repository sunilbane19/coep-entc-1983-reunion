name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Ensure V3 admin enhancements are loaded
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('v3/index.html')
          s = p.read_text(encoding='utf-8')
          prefix = '<script src="./v3-admin-tools.js'
          if prefix not in s:
              tag = f'<script src="./v3-admin-tools.js?v={os.environ["DEPLOY_SHA"]}"></script>'
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in v3/index.html')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          print('V3 admin tools script present in deployment artifact')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

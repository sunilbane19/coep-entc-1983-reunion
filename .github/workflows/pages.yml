name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch V3 Admin UI on main deployment source
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('v3/index.html')
          s = p.read_text(encoding='utf-8')
          before = s

          # The live site has been serving the main branch's V3 renderer.
          # Patch the renderer itself so the Admin UI does not depend on a
          # post-render enhancement script.
          s = s.replace('+ Add New Member', '+ Add Member')
          s = s.replace('✓ Complete '+"'", '✓ Done '+"'")
          s = s.replace('○ Not completed '+"'", '○ Not Done '+"'")

          old = 'Class Updates</button><button class="btn" onclick="adminAdd()">+ Add Member</button>'
          new = 'Class Updates</button><button class="btn secondary" onclick="location.href=\'/v3/admin-albums.html\'">Photo Albums</button><button class="btn" onclick="adminAdd()">+ Add Member</button>'
          if old in s and 'onclick="location.href=\'/v3/admin-albums.html\'"' not in s:
              s = s.replace(old, new, 1)

          # Ensure the enhanced Admin tools (Export / Print / photo album
          # navigation) is loaded when main is the Pages source.
          if 'v3-admin-tools.js' not in s:
              tag = f'<script src="/v3/v3-admin-tools.js?v={os.environ["DEPLOY_SHA"]}"></script>'
              s = s.replace('</body>', tag + '</body>', 1)

          if s == before:
              print('Main V3 Admin source already patched')
          else:
              p.write_text(s, encoding='utf-8')
              print('Patched main v3/index.html')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/index.html
          if git diff --cached --quiet; then
            echo "Main V3 Admin source already current"
          else
            git commit -m "V3: patch Admin UI on main source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Refresh V3 admin tools cache key on gh-pages
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          git fetch origin gh-pages
          git switch --detach origin/gh-pages
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('v3/index.html')
          s = p.read_text(encoding='utf-8')

          # Refresh the external enhancement script URL.
          pattern = r'(<script\s+src=["\'](?:\./|/v3/)?v3-admin-tools\.js\?v=)[^"\']*(["\'])'
          s2, n = re.subn(pattern, r'\g<1>' + os.environ['DEPLOY_SHA'] + r'\2', s, count=1)
          if n == 0:
              marker = '</head>'
              tag = f'<script src="./v3-admin-tools.js?v={os.environ["DEPLOY_SHA"]}"></script>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in gh-pages/v3/index.html')
              s2 = s.replace(marker, tag + marker, 1)

          # Patch the CORE Admin renderer itself. This is the important fix:
          # the desired Admin labels/actions must be generated by adminPage(),
          # rather than relying on a post-render enhancement script.
          s2 = s2.replace('+ Add New Member', '+ Add Member')
          s2 = s2.replace('✓ Complete '+"'", '✓ Done '+"'")
          s2 = s2.replace('○ Not completed '+"'", '○ Not Done '+"'")

          # Add Photo Albums to the core Admin action row if it is not already
          # present in the generated adminPage() markup.
          old = 'Class Updates</button><button class="btn" onclick="adminAdd()">+ Add Member</button>'
          new = 'Class Updates</button><button class="btn secondary" onclick="location.href=\'/v3/admin-albums.html\'">Photo Albums</button><button class="btn" onclick="adminAdd()">+ Add Member</button>'
          if old in s2 and 'onclick="location.href=\'/v3/admin-albums.html\'"' not in s2:
              s2 = s2.replace(old, new, 1)

          # Add core Export / Print controls after the Admin filter row.
          marker = '<div id="adminList" class="admin-list"></div>'
          replacement = '<div class="v3-admin-tools" style="display:flex;gap:7px;align-items:center;margin-top:12px;flex-wrap:wrap"><button class="btn" type="button" onclick="typeof window.exportExcel===\'function\'?window.exportExcel():alert(\'Export is available after the Admin tools script loads.\')">Export</button><button class="btn secondary" type="button" onclick="typeof window.printList===\'function\'?window.printList():window.print()">Print</button></div>'+marker
          if marker in s2 and 'typeof window.exportExcel' not in s2:
              s2 = s2.replace(marker, replacement, 1)

          # Keep the inline fallback too, so route timing remains hardened.
          inline = r'''<script data-v3-admin-inline="1">(function(){'use strict';function patch(){try{var app=document.getElementById('app');if(!app)return;var bs=Array.from(app.querySelectorAll('.actions button'));var u=bs.find(function(b){return b.textContent.trim()==='Class Updates'});var a=bs.find(function(b){return /^\+ Add New Member$|^\+ Add Member$/.test(b.textContent.trim())});if(a)a.textContent='+ Add Member';if(u&&!document.getElementById('v3InlineAlbums')){var p=document.createElement('button');p.id='v3InlineAlbums';p.className='btn secondary';p.type='button';p.textContent='Photo Albums';p.onclick=function(){location.href='/v3/admin-albums.html'};(a||u).parentNode.insertBefore(p,a||null)}var c=document.getElementById('filterComplete'),q=document.getElementById('filterPending'),members=window.adminMembers||[];if(c)c.textContent='✓ Done '+members.filter(function(m){return !!m.profile_completed}).length;if(q)q.textContent='○ Not Done '+members.filter(function(m){return !m.profile_completed}).length;if(document.getElementById('adminQ')&&!document.getElementById('v3InlineExport')){var f=app.querySelector('.admin-filters');if(f){var w=document.createElement('div');w.id='v3InlineExport';w.className='v3-admin-tools';w.style.cssText='display:flex;gap:7px;align-items:center;margin-top:12px;flex-wrap:wrap';var e=document.createElement('button');e.className='btn';e.type='button';e.textContent='Export';e.onclick=function(){if(typeof window.exportExcel==='function')return window.exportExcel();alert('Export is available after the Admin tools script loads.')};var pr=document.createElement('button');pr.className='btn secondary';pr.type='button';pr.textContent='Print';pr.onclick=function(){if(typeof window.printList==='function')return window.printList();window.print()};w.append(e,pr);f.insertAdjacentElement('afterend',w)}}}catch(e){window.__v3InlineAdminError=String(e&&e.stack||e)}}function boot(){patch();var n=0,id=setInterval(function(){patch();if(++n>30)clearInterval(id)},250)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();window.addEventListener('load',patch);window.addEventListener('hashchange',function(){setTimeout(patch,0)});if(document.body)new MutationObserver(patch).observe(document.body,{childList:true,subtree:true});})();</script>'''
          if 'data-v3-admin-inline="1"' in s2:
              s2 = re.sub(r'<script data-v3-admin-inline="1">.*?</script>', inline, s2, count=1, flags=re.S)
          else:
              s2 = s2.replace('</body>', inline + '</body>', 1)

          p.write_text(s2, encoding='utf-8')
          print('V3 Admin core renderer patched and cache key refreshed:', os.environ['DEPLOY_SHA'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/index.html
          if git diff --cached --quiet; then
            echo "gh-pages V3 already current"
          else
            git commit -m "V3: patch Admin UI in core renderer [deploy]"
            git push origin HEAD:gh-pages
          fi
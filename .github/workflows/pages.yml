name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh V3 admin tools cache key on gh-pages
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          git fetch origin gh-pages
          git switch --detach origin/gh-pages
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('v3/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<script\s+src=["\'](?:\./|/v3/)?v3-admin-tools\.js\?v=)[^"\']*(["\'])'
          s2, n = re.subn(pattern, r'\g<1>' + os.environ['DEPLOY_SHA'] + r'\2', s, count=1)
          if n == 0:
              marker = '</head>'
              tag = f'<script src="./v3-admin-tools.js?v={os.environ["DEPLOY_SHA"]}"></script>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in gh-pages/v3/index.html')
              s2 = s.replace(marker, tag + marker, 1)
          p.write_text(s2, encoding='utf-8')
          print('V3 admin tools loader refreshed:', os.environ['DEPLOY_SHA'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/index.html
          if git diff --cached --quiet; then
            echo "gh-pages loader already current"
          else
            git commit -m "V3: refresh admin tools asset URL [deploy]"
            git push origin HEAD:gh-pages
          fi

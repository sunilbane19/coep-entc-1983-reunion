name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch V3 source and cache-bust
        env:
          DEPLOY_SHA: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('v3/index.html')
          s = p.read_text(encoding='utf-8')
          before = s
          s = s.replace('+ Add New Member', '+ Add Member')
          s = s.replace('✓ Complete '+"'", '✓ Done '+"'")
          s = s.replace('○ Not completed '+"'", '○ Not Done '+"'")
          s = s.replace('onclick="location.href=\'/v3/admin-albums.html\'"', 'onclick="location.href=&quot;/v3/admin-albums.html&quot;"')
          old = 'Class Updates</button><button class="btn" onclick="adminAdd()">+ Add Member</button>'
          new = 'Class Updates</button><button class="btn secondary" onclick="location.href=&quot;/v3/admin-albums.html&quot;">Photo Albums</button><button class="btn" onclick="adminAdd()">+ Add Member</button>'
          if old in s and 'onclick="location.href=&quot;/v3/admin-albums.html&quot;"' not in s:
              s = s.replace(old, new, 1)
          # Put Export/Print into the core Admin markup itself. This is the same
          # working export/print implementation, but avoids depending on a
          # MutationObserver timing race after adminPage() replaces #app.
          tools = '<div id="v3AdminToolsButtons" class="v3-admin-tools"><button class="btn" type="button" onclick="window.v3AdminExport && window.v3AdminExport()">Export</button><button class="btn secondary" type="button" onclick="window.v3AdminPrint && window.v3AdminPrint()">Print</button></div>'
          marker = '<div id="adminList" class="admin-list"></div>'
          if marker in s and 'id="v3AdminToolsButtons"' not in s:
              s = s.replace(marker, tools + marker, 1)
          photos = r'''const GOOGLE_PHOTOS_URL="https://photos.app.goo.gl/RN9Ttn1H7SMMt8CL6";
          async function photosPage(){
            const app=$("app");
            if(!app)return;
            app.innerHTML='<section class="card"><h2>Photos</h2><div class="stat">Our reunion photographs are shared in our common photo albums.</div><div class="notice">Loading photo albums…</div></section>';
            const r=await sb.from("reunion_photo_albums").select("id,title,description,url,sort_order,is_active").eq("is_active",true).order("sort_order").order("id");
            if(r.error){app.innerHTML='<section class="card"><h2>Photos</h2><div class="notice error">'+esc(r.error.message)+'</div></section>';return}
            const albums=r.data||[];
            const grid='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px;';
            const card='background:linear-gradient(135deg,#fffdf8,#fff4dc);border:1px solid #dcc9a5;border-radius:20px;padding:24px;display:flex;flex-direction:column;min-height:250px;box-sizing:border-box;box-shadow:0 4px 14px rgba(80,50,10,.06);';
            app.innerHTML='<section class="card"><h2>Photos</h2><div class="stat">Our reunion photographs are shared in our common photo albums.</div><div class="v3-photo-album-grid" style="'+grid+'">'+albums.map(x=>'<article class="v3-photo-album-card" style="'+card+'"><div class="album-order" style="font-size:12px;color:#765;margin-bottom:10px">Album '+esc(x.sort_order)+'</div><h3 style="font-size:27px;margin:0 0 10px">'+esc(x.title||"Photo Album")+'</h3><p style="line-height:1.55;margin:0;color:#765">'+esc(x.description||"")+'</p><div class="actions" style="margin-top:auto;padding-top:20px"><a class="btn photos-open-btn" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Open Photo Album <span aria-hidden="true">→</span></a></div></article>').join("")+'</div></section>';
          }
          async function start(){'''
          pattern = r'const GOOGLE_PHOTOS_URL=.*?\nasync function start\(\)\{'
          s, n = re.subn(pattern, photos, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate the core Photos renderer')
          pattern2 = r'(<script\s+src=["\'](?:\./|/v3/)?v3-admin-tools\.js\?v=)[^"\']*(["\'])'
          s, n2 = re.subn(pattern2, r'\g<1>' + os.environ['DEPLOY_SHA'] + r'\2', s, count=1)
          if n2 == 0:
              s = s.replace('</body>', f'<script src="/v3/v3-admin-tools.js?v={os.environ["DEPLOY_SHA"]}"></script></body>', 1)
          if s == before:
              print('No V3 source changes needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('Patched V3 source')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('v3/v3-admin-tools.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('function addExport(){')
          end = s.find('function noBack(){', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Admin Export/Print function boundaries')
          replacement = "function addExport(){var existing=document.getElementById(BUTTONS_ID);if(existing)return;var list=document.getElementById('adminList');var filters=document.querySelector('.admin-filters');var q=document.getElementById('adminQ');if(!list&&!filters&&!q)return;var anchor=list||filters||q;var w=document.createElement('div');w.id=BUTTONS_ID;w.className='v3-admin-tools';var e=document.createElement('button');e.className='btn';e.textContent='Export';e.type='button';e.onclick=exportExcel;var p=document.createElement('button');p.className='btn secondary';p.textContent='Print';p.type='button';p.onclick=printList;w.append(e,p);if(list)list.parentNode.insertBefore(w,list);else if(filters)filters.insertAdjacentElement('afterend',w);else q.parentElement.appendChild(w)}"
          s = s[:start] + replacement + s[end:]
          if 'window.v3AdminExport=exportExcel;window.v3AdminPrint=printList;' not in s:
              s = s.replace('\n})();', '\nwindow.v3AdminExport=exportExcel;window.v3AdminPrint=printList;\n})();')
          p.write_text(s, encoding='utf-8')
          print('Patched Admin Export/Print insertion point')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/index.html v3/v3-admin-tools.js
          if git diff --cached --quiet; then
            echo "Main V3 source already current"
          else
            git commit -m "V3: make Admin Export and Print controls robust [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy exact V3 source to gh-pages
        run: |
          git fetch origin main gh-pages
          git worktree add /tmp/gh-pages-deploy origin/gh-pages
          cd /tmp/gh-pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages origin/gh-pages
          git checkout origin/main -- v3/index.html v3/v3-admin-tools.js
          git add v3/index.html v3/v3-admin-tools.js
          if git diff --cached --quiet; then
            echo "gh-pages V3 source already matches main"
          else
            git commit -m "Deploy V3 source from main [skip ci]"
            git push origin HEAD:gh-pages
          fi

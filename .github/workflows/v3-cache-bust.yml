name: V3 cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bust:
    if: "!contains(github.event.head_commit.message, '[v3-cache-bust]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update V3 asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v3/index.html')
          s = p.read_text()
          old = '/v3/v3-admin-tools.js?v=20260915-1'
          new = '/v3/v3-admin-tools.js?v=20260916-1'
          if old not in s:
              raise SystemExit('Expected V3 asset reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cache-bust change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/index.html
          git commit -m 'V3: refresh admin tools asset URL [v3-cache-bust]'
          git push

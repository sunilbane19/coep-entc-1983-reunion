er('hashchange',function(){toFrame();hideForRoute();});f.addEventListener('load',function(){hideForRoute();setTimeout(function(){try{lastHash=f.contentWindow.location.hash||'#home';}catch(e){}},100);});setInterval(watchChild,100);var n=0,t=setInterval(function(){if(ready()){clearInterval(t);reveal();}else if(++n>150){clearInterval(t);}},100);})();</script><script src="/v3-loader.js?v=20260915-9"></script></body></html>

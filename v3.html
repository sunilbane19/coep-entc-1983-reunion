<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — V3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf5e9}#app{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" src="/" title="COEP ENTC 1983 Reunion"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const LABELS={all:'All',complete:'Complete',pending:'Not completed',admins:'Admin'};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function csv(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  function filteredRows(){
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!Array.isArray(w.adminMembers)) return [];
    const q=(d.getElementById('adminQ')?.value||'').toLowerCase();
    let rows=w.adminMembers.filter(m=>[
      m.full_name,m.preferred_name,m.mobile,m.whatsapp_phone,m.email,
      m.current_city,m.current_state,m.current_country,m.profession,m.company
    ].some(v=>String(v||'').toLowerCase().includes(q)));
    const f=w.adminFilter||'all';
    if(f==='complete')rows=rows.filter(m=>m.profile_completed);
    if(f==='pending')rows=rows.filter(m=>!m.profile_completed);
    if(f==='admins')rows=rows.filter(m=>(w.adminRoles||{})[m.id]==='admin');
    return rows;
  }
  function shareRows(){return filteredRows().map((m,i)=>({
    sn:i+1,
    name:m.full_name||m.preferred_name||'',
    address:m.detailed_address||'',
    city:m.current_city||'',
    phone:m.mobile||m.whatsapp_phone||'',
    email:m.email||''
  }));}
  function filterLabel(){
    const w=frame.contentWindow,d=frame.contentDocument;
    const f=w?.adminFilter||'all';
    const q=(d?.getElementById('adminQ')?.value||'').trim();
    return LABELS[f]||'All'+(q?' — Search: '+q:'');
  }
  function downloadExcel(){
    const rows=shareRows();
    const headers=['S.N.','Name','Address','Town / City','Phone No.','Email'];
    const body=[headers,...rows.map(r=>[r.sn,r.name,r.address,r.city,r.phone,r.email])]
      .map(r=>r.map(csv).join(',')).join('\r\n');
    const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='COEP_ENTC_1983_'+(frame.contentWindow?.adminFilter||'all')+'_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function printList(){
    const rows=shareRows();
    const d=frame.contentDocument;
    const q=(d?.getElementById('adminQ')?.value||'').trim();
    const date=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    const title='COEP ENTC 1983 — Class Reunion';
    const sub=filterLabel()+(q?'':'')+' | '+date;
    const table=rows.map(r=>'<tr><td>'+esc(r.sn)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.email)+'</td></tr>').join('');
    const win=window.open('','_blank','width=1200,height=800');
    if(!win){alert('Please allow pop-ups for this site to print the list.');return;}
    win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:landscape;margin:12mm}body{font-family:Arial,sans-serif;color:#222;margin:0}h1{font:700 22px Georgia,serif;margin:0 0 5px}p{margin:0 0 14px;color:#666;font-size:12px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #aaa;padding:6px 7px;text-align:left;vertical-align:top}th{background:#eee;font-weight:700}td:first-child,th:first-child{width:38px;text-align:center}td:nth-child(2),th:nth-child(2){width:18%}td:nth-child(3),th:nth-child(3){width:29%}td:nth-child(4),th:nth-child(4){width:15%}td:nth-child(5),th:nth-child(5){width:14%}td:nth-child(6),th:nth-child(6){width:20%}</style></head><body><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p><table><thead><tr><th>S.N.</th><th>Name</th><th>Address</th><th>Town / City</th><th>Phone No.</th><th>Email</th></tr></thead><tbody>'+table+'</tbody></table><script>window.onload=function(){window.focus();window.print();};<\/script></body></html>');
    win.document.close();
  }
  function install(){
    let d,w;
    try{d=frame.contentDocument;w=frame.contentWindow;}catch(e){return;}
    if(!d||!w)return;
    const admin=d.getElementById('adminList');
    const toolbar=d.querySelector('.admin-toolbar');
    if(!admin||!toolbar)return;
    const header=toolbar.parentElement?.querySelector('div:first-child');
    if(!header)return;
    const actions=header.querySelector('.actions');
    if(!actions||actions.querySelector('[data-v3-export]'))return;
    const make=(label,handler)=>{const b=d.createElement('button');b.className='btn secondary';b.textContent=label;b.setAttribute('data-v3-export','1');b.addEventListener('click',handler);return b;};
    actions.appendChild(make('Export Excel',downloadExcel));
    actions.appendChild(make('Print',printList));
  }
  frame.addEventListener('load',()=>{install();setTimeout(install,300);setTimeout(install,1000);});
  setInterval(install,1000);
})();
</script>
</body>
</html>

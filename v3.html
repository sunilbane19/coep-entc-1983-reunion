<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — V3</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf5e9}#app{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" src="/" title="COEP ENTC 1983 Reunion"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const LABELS={all:'All',complete:'Complete',pending:'Not completed',admins:'Admin'};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function filteredRows(){
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!Array.isArray(w.adminMembers)) return [];
    const q=(d.getElementById('adminQ')?.value||'').toLowerCase();
    let rows=w.adminMembers.filter(m=>[
      m.full_name,m.preferred_name,m.mobile,m.whatsapp_phone,m.email,
      m.current_city,m.current_state,m.current_country,m.profession,m.company
    ].some(v=>String(v||'').toLowerCase().includes(q)));
    const f=w.adminFilter||'all';
    if(f==='complete')rows=rows.filter(m=>m.profile_completed);
    if(f==='pending')rows=rows.filter(m=>!m.profile_completed);
    if(f==='admins')rows=rows.filter(m=>(w.adminRoles||{})[m.id]==='admin');
    return rows;
  }
  function shareRows(){return filteredRows().map((m,i)=>({
    sn:i+1,
    name:m.full_name||m.preferred_name||'',
    address:m.detailed_address||'',
    city:m.current_city||'',
    phone:m.mobile||m.whatsapp_phone||'',
    email:m.email||''
  }));}
  function filterLabel(){
    const w=frame.contentWindow,d=frame.contentDocument;
    const f=w?.adminFilter||'all';
    const q=(d?.getElementById('adminQ')?.value||'').trim();
    const base=LABELS[f]||'All';
    return q?base+' — Search: '+q:base;
  }
  function fileName(){
    const f=frame.contentWindow?.adminFilter||'all';
    return 'COEP_ENTC_1983_'+f+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
  }
  async function makeExcel(){
    const rows=shareRows();
    if(!window.ExcelJS){alert('Excel export is still loading. Please try again.');return null;}
    const wb=new ExcelJS.Workbook();
    wb.creator='COEP ENTC 1983 Class Reunion';
    wb.created=new Date();
    const ws=wb.addWorksheet('Class List');
    ws.columns=[
      {header:'S.N.',key:'sn',width:8},
      {header:'Name',key:'name',width:28},
      {header:'Address',key:'address',width:42},
      {header:'Town / City',key:'city',width:22},
      {header:'Phone No.',key:'phone',width:20},
      {header:'Email',key:'email',width:34}
    ];
    ws.addRows(rows);
    ws.insertRow(1,['COEP ENTC 1983 — Class Reunion']);
    ws.mergeCells('A1:F1');
    ws.getCell('A1').font={name:'Georgia',size:16,bold:true};
    ws.getCell('A1').alignment={vertical:'middle',horizontal:'left'};
    ws.getRow(1).height=25;
    ws.insertRow(2,[filterLabel()+' | '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})]);
    ws.mergeCells('A2:F2');
    ws.getCell('A2').font={size:10,italic:true};
    ws.getCell('A2').alignment={vertical:'middle'};
    ws.getRow(2).height=20;
    const header=ws.getRow(3);
    header.font={bold:true};
    header.alignment={vertical:'middle',horizontal:'left'};
    header.height=22;
    header.eachCell(c=>{c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};});
    ws.eachRow((row,n)=>{if(n>=4){row.alignment={vertical:'top',wrapText:true};row.eachCell(c=>{c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};});}});
    ws.views=[{state:'frozen',ySplit:3}];
    ws.autoFilter={from:'A3',to:'F'+Math.max(3,rows.length+3)};
    return await wb.xlsx.writeBuffer();
  }
  async function downloadExcel(){
    const buffer=await makeExcel();
    if(!buffer)return;
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName();
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  async function shareExcel(){
    const buffer=await makeExcel();
    if(!buffer)return;
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const file=new File([blob],fileName(),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(max-width:700px)').matches);
    if(isMobile&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      try{await navigator.share({title:'COEP ENTC 1983 Class List',text:filterLabel(),files:[file]});return;}catch(e){if(e?.name==='AbortError')return;}
    }
    await downloadExcel();
  }
  function printList(){
    const rows=shareRows();
    const date=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    const title='COEP ENTC 1983 — Class Reunion';
    const sub=filterLabel()+' | '+date;
    const table=rows.map(r=>'<tr><td>'+esc(r.sn)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.email)+'</td></tr>').join('');
    const win=window.open('','_blank','width=1200,height=800');
    if(!win){alert('Please allow pop-ups for this site to print the list.');return;}
    win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:landscape;margin:12mm}body{font-family:Arial,sans-serif;color:#222;margin:0}h1{font:700 22px Georgia,serif;margin:0 0 5px}p{margin:0 0 14px;color:#666;font-size:12px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #aaa;padding:6px 7px;text-align:left;vertical-align:top}th{font-weight:700}td:first-child,th:first-child{width:38px;text-align:center}</style></head><body><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p><table><thead><tr><th>S.N.</th><th>Name</th><th>Address</th><th>Town / City</th><th>Phone No.</th><th>Email</th></tr></thead><tbody>'+table+'</tbody></table><script>window.onload=function(){window.focus();window.print();};<\/script></body></html>');
    win.document.close();
  }
  function install(){
    let d,w;
    try{d=frame.contentDocument;w=frame.contentWindow;}catch(e){return;}
    if(!d||!w)return;
    const admin=d.getElementById('adminList');
    const filters=d.querySelector('.admin-filters');
    if(!admin||!filters)return;
    if(d.getElementById('v3Share'))return;
    const style=d.createElement('style');style.textContent='.v3-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:4px}.v3-actions .btn{white-space:nowrap}@media(max-width:700px){.v3-actions{width:100%;margin-left:0}.v3-actions .btn{flex:1;min-width:110px}}';d.head.appendChild(style);
    const box=d.createElement('div');box.className='v3-actions';
    const make=(id,label,handler)=>{const b=d.createElement('button');b.id=id;b.className='btn secondary';b.type='button';b.textContent=label;b.addEventListener('click',handler);return b;};
    box.appendChild(make('v3Share','↗ Share',shareExcel));
    box.appendChild(make('v3Print','Print',printList));
    filters.appendChild(box);
  }
  frame.addEventListener('load',()=>{install();setTimeout(install,300);setTimeout(install,1000);});
  setInterval(install,1000);
})();
</script>
</body>
</html>

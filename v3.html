<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"><\\/script>
<script>
(function(){

  function install(){const f=document.querySelector('.admin-filters');if(!f||document.getElementById('v3Actions'))return;const s=document.createElement('style');s.textContent='.v3-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:4px}.v3-actions .btn{white-space:nowrap}@media(max-width:700px){.v3-actions{width:100%;margin-left:0}.v3-actions .btn{flex:1;min-width:110px}}';document.head.appendChild(s);const box=document.createElement('div');box.id='v3Actions';box.className='v3-actions';[['v3Share','↗ Share',share],['v3Print','Print',printList]].forEach(([id,text,fn])=>{const b=document.createElement('button');b.id=id;b.type='button';b.className='btn secondary';b.textContent=text;b.onclick=fn;box.appendChild(b)});f.appendChild(box);}

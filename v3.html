<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COEP ENTC 1983 — V3</title>
<style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5e9}#status{font:16px Arial,sans-serif;padding:24px;color:#555}</style>
</head>
<body>
<div id="status">Loading COEP ENTC 1983 Reunion V3…</div>
<script>
(async function(){
  try{
    const r=await fetch('/',{cache:'no-store'});
    if(!r.ok) throw new Error('Unable to load the reunion application.');
    let html=await r.text();
    html=html.replace(/<base[^>]*>/i,'').replace(/<head([^>]*)>/i,'<head$1><base href="/">');
    html=html.replace(/<\/body>/i,'<script src="/v3-enhancements.js"><\\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    const s=document.getElementById('status');
    if(s)s.textContent=e.message||'Unable to load the reunion application.';
  }
})();
</script>
</body>
</html>
